<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Kotassium</title>
<link rel=manifest href=/manifest.webmanifest>
<link rel=apple-touch-icon href=/icons/apple-touch-icon.png>
<meta name=theme-color content="#121212">
<meta name=mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<style>
*{box-sizing:border-box}html,body{height:100%}
:root{--font-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-size-body:14px;--font-size-title:24px;--font-size-section:12px;--font-weight-regular:400;--font-weight-medium:500;--font-weight-semibold:600;--font-weight-bold:700;--font-weight-heavy:800}
h1,h2,h3{font-family:var(--font-ui);font-weight:var(--font-weight-bold);letter-spacing:-.02em}
h2{font-size:var(--font-size-title)}
h3{font-size:16px}
body{background:#000;color:#fff;font-family:var(--font-ui);font-size:var(--font-size-body);font-weight:var(--font-weight-regular);margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#root{flex:1;min-height:0;display:flex;flex-direction:column}
button{background:none;border:0;color:#fff;cursor:pointer;font-family:inherit}
input{background:none;border:0;color:#fff;font-family:inherit}
input:focus{outline:none}
button:focus-visible,[role=button]:focus-visible,[role=link]:focus-visible,[role=slider]:focus-visible{outline:2px solid #1ed760;outline-offset:2px}
svg{display:block}
#top{height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;background:#000;position:relative;z-index:5}
#homeBtn{width:48px;height:48px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;transition:transform .1s;flex:none}
#homeBtn:hover{transform:scale(1.06);background:#2a2a2a}
#searchwrap{background:#1f1f1f;border-radius:999px;height:48px;flex:1 1 480px;max-width:600px;display:flex;align-items:center;padding:0 14px;border:1px solid transparent}
#searchwrap:hover{background:#2a2a2a}
#searchwrap:focus-within{border-color:#1ed760;background:#242424}
#q{width:100%;min-width:0;font-size:16px;margin-left:8px}
#q::placeholder{color:#b3b3b3}
#qClear{display:none;width:24px;height:24px;border-radius:50%;background:#ffffff26;color:#fff;place-items:center;flex:none}
#qClear:hover{background:#ffffff40}
#searchwrap.filled #qClear{display:grid}
/* Spotify-style islands: black shell, rounded panels, and the gutter between
   them is the drag affordance instead of a painted handle bar. */
#mid{flex:1;display:flex;min-height:0;background:#000;padding:8px;gap:8px}
#side{flex:0 0 262px;background:#121212;border-radius:8px;display:flex;flex-direction:column;min-height:0;transition:flex-basis .2s}
#mid.resizing #side{transition:none}
#sideResize{position:relative;z-index:2;width:8px;flex:none;margin:0 -8px;cursor:col-resize;touch-action:none;border-radius:8px;transition:background .15s}
#sideResize:hover,#mid.resizing #sideResize{background:#ffffff1a}
#sideResize:focus-visible{outline:2px solid #1ed760;outline-offset:0}
#main{flex:1;background:#121212;border-radius:8px;overflow-y:auto;position:relative}
#main,#sideList{scrollbar-width:none}
#main::-webkit-scrollbar,#sideList::-webkit-scrollbar{width:0}
#sideHead{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#sideHead #libBtn{display:grid;width:28px;height:28px;border-radius:50%;background:transparent;color:#b3b3b3;flex:none;padding:4px}
#sideHead #libBtn:hover{color:#fff;background:#ffffff14}
.top-lib{display:none!important}
#sideHead b{color:#b3b3b3;display:flex;align-items:center;gap:6px}
/* padding:0 matters: the shared button padding (1px 6px) leaves a 14px content
   box for a 17px glyph, so the icon could only centre inside the content box
   and sat 1.5px right of the button's centre. */
#addBtn{width:26px;height:26px;color:#b3b3b3;display:grid;place-items:center;cursor:pointer;padding:0}
#addBtn:hover{color:#fff}
#collSide{width:26px;height:26px;color:#b3b3b3;display:grid;place-items:center;cursor:pointer;flex:none}
#collSide:hover{color:#fff}
#side.collapsed{flex:0 0 68px}
#side.collapsed #sideHead{justify-content:center;padding:12px 0}
#side.collapsed #sideHead #libBtn{display:grid!important}
#side.collapsed #sideHead b,#side.collapsed #addBtn{display:none}
/* The hover/active pill is the only border a collapsed row shows, so it has to
   surround the cover evenly: 6px top and bottom against 2px at the sides read
   as a thick bar above and below the artwork. 2px + a 48px cover fills the
   52px the collapsed list gives us, exactly, and the margin puts back the
   vertical rhythm the padding used to provide (2+4+4+2 = the 12px gap between
   covers the old 6px padding gave). */
#side.collapsed .pitem{justify-content:center;padding:2px;margin:4px 0 8px;gap:0}
#side.collapsed .pmeta{display:none}
#side.collapsed .pcover{width:48px;height:48px}
#side.collapsed #empty{display:none}
#sideList{flex:1;overflow-y:auto;padding:0 8px}
#side.collapsed #sideList::-webkit-scrollbar{width:0}
.pitem{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px;cursor:pointer}
.pitem:hover{background:#ffffff14}
.pitem.active{background:#ffffff1f}
.pcover{width:44px;height:44px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:var(--font-weight-heavy);font-size:16px;position:relative;cursor:pointer}
.pitem:hover .pcover{box-shadow:inset 0 0 0 999px #0007}
.pcoverPlay{position:absolute;inset:0;z-index:1;display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .12s}
.pitem:hover .pcoverPlay,.pcoverPlay:focus-visible{opacity:1}
#side.collapsed .pcoverPlay svg{width:22px;height:22px}
.pmeta{min-width:0}
.pmeta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:#b3b3b3;font-size:12px}
#homeView{padding:24px 32px}
#homeView h2{margin:0 0 16px}
#feature{display:flex;align-items:center;gap:24px;padding:24px;margin:0 0 32px;border-radius:12px;cursor:pointer;transition:filter .15s}
#feature:hover{filter:brightness(1.08)}
#feature .fcover{width:152px;height:152px;border-radius:8px;flex:none;box-shadow:0 8px 24px #0006}
#feature .finfo{flex:1;min-width:0}
#feature .finfo small{font-size:12px;font-weight:var(--font-weight-bold);color:#ffffffb3}
#feature .finfo h2{font-size:40px;line-height:1.1;margin:6px 0 8px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feature .finfo p{margin:0;color:#ffffffb3;font-size:14px}
#feature .fplay{margin-top:16px}
.fplay{height:56px;padding:0 28px 0 22px;border-radius:999px;background:#1ed760;color:#000;display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:var(--font-weight-bold);flex:none;box-shadow:0 8px 24px #0006;transition:transform .15s,background .15s}
.fplay:hover{background:#3be477;transform:scale(1.03)}

.card b,.pmeta b,#nowt b,.rtxt b{font-weight:var(--font-weight-semibold)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:#181818;border-radius:8px;padding:16px;cursor:pointer;transition:background .2s}
.card:hover{background:#282828}
.ccover{width:100%;aspect-ratio:1;border-radius:6px;position:relative}
.card b{display:block;font-size:16px;margin:10px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#b3b3b3;font-size:14px;display:block}
/* The card's play disc waits for the pointer, so the hero above stays the one green call to action. */
.card-play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 6px 16px #0008}
.card:hover .card-play,.card-play:focus-visible{opacity:1;transform:none}
.card:hover .card-play:hover{transform:scale(1.06)}
@media(hover:none){.card-play{display:none}}
#plhead{padding:64px 32px 24px;display:flex;align-items:flex-end;gap:24px}
#plx{width:210px;height:210px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:64px;font-weight:var(--font-weight-heavy);color:#ffffffd9;box-shadow:0 8px 24px #0006}
.plinfo small{display:block;font-size:12px;font-weight:var(--font-weight-bold)}
.plinfo h1{font-size:clamp(40px,4.6vw,64px);margin:4px 0 8px;line-height:1}
#dfsInfo b,#fsTxt b{font-size:24px;font-weight:var(--font-weight-bold);letter-spacing:-.02em}
.plinfo p{color:#ffffffe6;font-size:14px;margin:0}
#plactions{display:flex;align-items:center;gap:28px;padding:20px 32px 12px}
#bigplay{width:56px;height:56px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;transition:transform .1s}
#bigplay:hover{transform:scale(1.05);background:#3be477}
#plactions svg{width:24px;height:24px}
#plactions .aicon{width:40px;height:40px}
.aicon{color:#b3b3b3;display:grid;place-items:center}
.aicon:hover{color:#fff}
.aicon.on{color:#1ed760}
#tbl{padding:0 32px 64px}
.tr-head,.row{display:grid;grid-template-columns:36px 4fr 2fr 60px;gap:14px;align-items:center;padding:4px 10px;border-radius:4px}
.tr-head{color:#b3b3b3;font-size:12px;border-bottom:1px solid #ffffff29;margin:0 0 8px;height:36px}
.tr-head span{line-height:36px}
.row{height:56px;cursor:default}
.row:hover{background:#ffffff12}
.trnum{color:#b3b3b3;font-variant-numeric:tabular-nums;font-size:16px}
.rt{min-width:0;display:flex;align-items:center;gap:12px}
.rtxt{min-width:0}
.rtxt b{display:block;font-size:16px;font-weight:var(--font-weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtxt small{color:#b3b3b3;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ralb{color:#b3b3b3;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdura{color:#b3b3b3;font-variant-numeric:tabular-nums;text-align:right}
/* A playlist whose tracks carry no album drops the column instead of showing an empty one. */
.no-album .tr-head,.no-album .row{grid-template-columns:36px 1fr 60px}
.no-album .tr-head span:nth-child(3),.no-album .ralb{display:none}
.row.playing .rtxt b,.srow.playing .rtxt b{color:#1ed760}
.row.playing .trnum{color:#1ed760}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:#1ed760;animation:b .9s ease infinite alternate}
.bars i:nth-child(2){animation-delay:.3s}.bars i:nth-child(3){animation-delay:.15s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes b{from{height:4px}to{height:14px}}
.srow{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:6px;height:56px}
.srow:hover{background:#ffffff12}
.stag{background:#333;color:#1ed760;font-size:12px;padding:2px 6px;border-radius:4px;font-weight:var(--font-weight-bold);align-self:center}
.rbtn{color:#b3b3b3}
.rbtn:hover{color:#fff}

/* --- Bottom bar --- */
#bar{height:76px;flex:none;background:#000;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 16px;gap:12px;transition:height .2s}
#nowp{display:flex;align-items:center;gap:12px;min-width:0}
#nowc{width:52px;height:52px;border-radius:6px;background:#282828;flex:none}
#nowt{min-width:0}
#nowt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowt small{color:#b3b3b3;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctr{display:flex;flex-direction:column;align-items:center;gap:8px}
#btns{display:flex;align-items:center;gap:18px}
#btns .aicon{width:32px;height:32px;flex:none}
#playb{width:40px;height:40px;flex:none;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;transition:box-shadow .06s}
#playb:hover{box-shadow:0 0 0 1px #fff}
#btns button:disabled,#fsBtns button:disabled,#dfsBtn:disabled{opacity:.35;cursor:default;pointer-events:none}
#playb:disabled{opacity:.35;background:#fff;color:#000;box-shadow:none;cursor:default}
#prow{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
.ptime{color:#b3b3b3;font-size:12px;min-width:34px;font-variant-numeric:tabular-nums}
#prog{flex:1;height:4px;background:#ffffff33;border-radius:4px;cursor:pointer;position:relative}
#progf{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:4px;width:0}
#prog:hover #progf{background:#1ed760}
#rside{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:#b3b3b3}
#rside .volume-row{width:auto;gap:4px}
#rside .volume-row .aicon{width:24px;height:24px;padding:0}
#rside #vol{width:112px;height:16px;position:relative;cursor:pointer;background:linear-gradient(to bottom,transparent 6px,#ffffff33 6px,#ffffff33 10px,transparent 10px)}
#volf{position:absolute;left:0;top:6px;bottom:6px;background:#fff;border-radius:4px}
#vol.dragging #volf{background:#1ed760}
#fs{display:none}
#dfsArt,#fsArt,#nowc{background-size:cover!important;background-position:center!important}
.track-cover{width:40px;height:40px;border-radius:4px;flex:none;background-size:cover!important;background-position:center!important}
.rside,.volume-row{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#b3b3b3}
.volume-row{width:90px}
#vol{width:100%;height:16px}
.stream-only{font-size:12px;color:#b3b3b3}
/* Compact Sonner/shadcn-inspired notifications, kept clear of player controls. */
.toast-viewport{position:fixed;top:max(72px,calc(env(safe-area-inset-top) + 64px));right:16px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:10px;width:min(420px,calc(100vw - 32px));pointer-events:none}
.toast-card{position:relative;display:flex;align-items:center;gap:12px;width:auto;max-width:100%;min-height:58px;padding:12px 12px 12px 14px;border:1px solid #ffffff1a;border-radius:8px;background:#111113;color:#fafafa;box-shadow:0 12px 32px #0009,0 2px 6px #0005;text-align:left;pointer-events:auto;animation:toast-in .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast-spinner{width:14px;height:14px;border:1.5px solid #ffffff36;border-top-color:#f4f4f5;border-radius:50%;animation:toast-spin .8s linear infinite}
@keyframes toast-spin{to{transform:rotate(360deg)}}
.toast-icon{width:22px;height:22px;flex:none;display:grid;place-items:center;border:1px solid #ffffff1a;border-radius:50%;background:#ffffff08;color:#d4d4d8;font-size:14px;font-weight:700}
.toast-success .toast-icon{border-color:#22c55e40;background:#22c55e12;color:#4ade80}
.toast-error .toast-icon{border-color:#ef444440;background:#ef444412;color:#f87171}
.toast-message{flex:1;min-width:0;margin:0;color:#f4f4f5;font-size:14px;font-weight:var(--font-weight-medium);line-height:1.45;overflow-wrap:anywhere}
.toast-close{width:26px;height:26px;flex:none;display:grid;place-items:center;margin:-2px -2px -2px 0;border:0;border-radius:6px;background:transparent;color:#85858c;cursor:pointer;transition:background .15s,color .15s}
.toast-close:hover{background:#ffffff10;color:#fff}
.toast-body{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0}
.toast-body b{font-size:14px;font-weight:var(--font-weight-semibold);line-height:1.3}
.toast-body>span{overflow:hidden;color:#a1a1aa;font-size:12px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}
.toast-download{width:100%;gap:11px}
.toast-progress{height:3px;width:100%;margin-top:5px;overflow:hidden;border-radius:4px;background:#ffffff1a}
.toast-progress i{display:block;height:100%;border-radius:inherit;background:#a1a1aa;transition:width .2s}
.toast-percent{flex:none;color:#a1a1aa;font-size:12px;font-variant-numeric:tabular-nums}
.toast-upnext .toast-icon{border-color:#ffffff20;color:#e4e4e7;font-size:14px}
@media(max-width:820px){.toast-viewport{top:max(72px,calc(env(safe-area-inset-top) + 64px));right:12px;width:calc(100vw - 24px);align-items:stretch}.toast-card{min-height:54px;padding:10px 11px 10px 12px}}
@media(prefers-reduced-motion:reduce){.toast-card{animation:none}.toast-spinner{animation:none}}
#upd{margin-left:0;height:44px;padding:0 9px 0 14px;background:#141414;border:1px solid #ffffff14;color:#f4f4f4;border-radius:12px;font-size:12px;display:none;align-items:center;gap:10px;flex:none;max-width:min(420px,45vw);min-width:0;box-shadow:0 5px 18px #0005}
#upd.on{display:flex}
#updtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Update controls use consistent icon sizing and an intentional install accent. */
#updcheck{background:transparent;color:#858585;border:0;border-radius:8px;width:28px;height:28px;padding:0;display:none;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:color .15s,background .15s}
#updcheck:hover{color:#fff;background:#ffffff12}
#updcheck:disabled{opacity:.45;cursor:default}
.lucide-spin{animation:updspin .9s linear infinite}
#updbtn{background:#292929;color:#d1d1d1;border:0;border-radius:8px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:color .15s,background .15s,transform .15s}
#updbtn:hover{color:#fff;background:#383838;transform:translateY(-1px)}
#updbtn.go{background:#1ed760;color:#08120a}
#updbtn.go:hover{background:#3be477;color:#08120a}
#updbtn:disabled{opacity:.6;cursor:default}
#updbtn.spin svg{animation:updspin .9s linear infinite}
@keyframes updspin{to{transform:rotate(360deg)}}
#upd.icononly{padding:0 5px;gap:0;border-color:transparent;background:transparent;box-shadow:none}
#upd.icononly #updbtn{width:38px;height:38px;border-radius:12px;background:#171717;color:#a8a8a8}
#upd.icononly #updbtn:hover{background:#292929;color:#fff}
#upd.icononly #updbtn.go{background:#1ed760;color:#08120a}
#upd.icononly #updbtn.go:hover{background:#3be477}
#upd:not(.icononly):hover{background:#2a2a2a}
#empty{color:#b3b3b3;padding:24px 8px;font-size:14px}

.empty-cta{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
#homeView .empty-cta h2{margin:0;font-size:24px}
.pill-cta{height:48px;display:inline-flex;align-items:center;gap:8px;padding:0 24px 0 20px;border-radius:999px;background:#1ed760;color:#000;font-size:14px;font-weight:var(--font-weight-bold);transition:background .15s,transform .15s}
.pill-cta:hover{background:#3be477;transform:scale(1.02)}
#bigplayBtns{display:flex}
/* ---------------- full screen mode (desktop / web, not mobile) ---------------- */
#dfsBtn{display:grid;place-items:center}
#dfs{display:none}
body.dfs #dfs{display:flex;position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;background:linear-gradient(180deg,#1c1c1c,#0a0a0a 60%)}
#dfs.open{display:flex;position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#1c1c1c,#0a0a0a 60%)}
#dfs.open #dfsQueue{width:340px;flex:none;border-left:1px solid #ffffff14;background:#111;display:flex;flex-direction:column;min-height:0;overflow:auto}
#dfs.open #dfsArt{width:min(52vh,40vw);aspect-ratio:1;border-radius:8px;background:#282828;box-shadow:0 30px 80px #000c;flex:none}
#dfs.open #dfsMain{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
body.dfs.dfsidle #dfsTop{opacity:0;pointer-events:none}
body.dfs.dfsidle #dfsInfo{opacity:1}
body.dfs #bar{position:fixed;left:0;right:0;bottom:0;z-index:95;transition:opacity .3s}
body.dfs.dfsidle #bar{opacity:0;pointer-events:none}
#dfsMain{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#dfsArt{width:min(52vh,40vw);aspect-ratio:1;border-radius:8px;background:#282828;box-shadow:0 30px 80px #000c;flex:none}
#dfsTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:18px 24px;transition:opacity .3s}
body.dfs.dfsidle #dfsTop{opacity:0;pointer-events:none}
#dfsTopTitle{flex:1;min-width:0;font-size:14px;font-weight:var(--font-weight-bold);color:#b3b3b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dfsExit{width:40px;height:40px;border-radius:50%;background:#ffffff14;color:#e5e5e5;display:grid;place-items:center;flex:none;border:0;cursor:pointer}
#dfsExit:hover{background:#ffffff26;color:#fff}
#dfsInfo{position:absolute;left:32px;bottom:32px;max-width:60%;opacity:0;transition:opacity .3s}
body.dfs.dfsidle #dfsInfo{opacity:1}

.setting-switch{width:42px;height:24px;flex:none;border:1px solid #ffffff1a;border-radius:999px;background:#2e2e2e;padding:2px;transition:background .18s,border-color .18s,box-shadow .18s}
.setting-switch i{display:block;width:18px;height:18px;border-radius:50%;background:#c4c4c4;box-shadow:0 1px 3px #0009;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .18s}
.setting-switch:hover i{background:#fff}
.setting-switch.enabled{background:#1ed760;border-color:#1ed760;box-shadow:0 0 14px #1ed7603d}
.setting-switch.enabled i{background:#061408;transform:translateX(18px)}
.setting-switch:focus-visible,.setting-seg button:focus-visible,.setting-act:focus-visible,.settings-close:focus-visible,#settingsBtn:focus-visible{outline:2px solid #1ed760;outline-offset:3px}
.setting-volume{display:flex;align-items:center;gap:12px;flex:0 1 210px}
.setting-volume input{appearance:none;-webkit-appearance:none;width:100%;height:5px;border-radius:4px;background:linear-gradient(to right,#1ed760 0 var(--range-progress),#ffffff26 var(--range-progress) 100%);cursor:pointer}
.setting-volume input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #1ed760;box-shadow:0 2px 6px #000a}
.setting-volume input::-moz-range-thumb{width:15px;height:15px;border:2px solid #1ed760;border-radius:50%;background:#fff;box-shadow:0 2px 6px #000a}
.setting-volume span{width:38px;text-align:right;color:#d8d8d8;font-size:12px;font-weight:var(--font-weight-semibold);font-variant-numeric:tabular-nums}
.setting-seg{display:flex;gap:2px;padding:3px;background:#00000047;border:1px solid #ffffff10;border-radius:8px;flex:none}
.setting-seg button{font-size:12px;font-weight:var(--font-weight-semibold);color:#9a9a9a;padding:6px 12px;border-radius:6px;transition:color .15s,background .15s}
.setting-seg button:hover{color:#e8e8e8}
.setting-seg button.on{background:#ffffff1f;color:#fff;box-shadow:0 1px 3px #0008}
.setting-act{flex:none;font-size:12px;font-weight:var(--font-weight-semibold);color:#061408;background:#1ed760;padding:8px 16px;border-radius:999px;transition:background .15s,transform .15s,opacity .15s}
.setting-act:hover{background:#3be477}
.setting-act:disabled{background:#2e2e2e;color:#8f8f8f;opacity:.75;cursor:default;transform:none}
.setting-value{flex:none;font-size:12px;font-weight:var(--font-weight-semibold);color:#b3b3b3;font-variant-numeric:tabular-nums;letter-spacing:.01em}



@media(max-width:820px){.link-backdrop{padding:12px;align-items:end}.link-dialog{border-radius:12px}.link-dialog-head{padding:20px 20px 0}.link-dialog-copy{padding:20px 22px 0}.link-dialog-copy h2{font-size:var(--font-size-title)}.link-form{padding:20px 22px 24px}#settingsBtn svg{width:20px;height:20px}.app-tooltip{display:none}.settings-backdrop{padding:12px;align-items:end}.settings-dialog{max-height:calc(100dvh - 24px);border-radius:12px}.settings-head{padding:22px 20px 16px}.settings-content{padding:4px 20px 6px}.setting-volume{flex:1 1 auto;min-width:130px}.setting-seg button{padding:6px 10px}}
@media(prefers-reduced-motion:reduce){.settings-backdrop,.settings-dialog,.settings-group,.link-backdrop,.link-dialog,.link-spinner{animation:none}.setting-switch,.setting-switch i,.settings-close,.setting-row,.setting-seg button,.setting-act{transition:none}}
/* library rail: the top-bar expand button gives way to a Spotify-style
   sidebar toggle + add pair, so the desktop header stays clean. */
@media(min-width:821px){.top-lib{display:none!important}}
#sideHead #libToggle{display:flex;align-items:center;gap:6px;min-width:0;padding:6px 10px;margin-left:-10px;border-radius:8px;background:transparent;color:#b3b3b3;font:inherit;font-weight:var(--font-weight-bold);flex:none;cursor:pointer;transition:color .15s,background .15s}
#sideHead #libToggle:hover{color:#fff;background:#ffffff14}
#sideHead #libToggle:hover b{color:#fff}
#sideHead #libToggle:focus-visible,#addBtn:focus-visible{outline:2px solid #1ed760;outline-offset:2px}
#side.collapsed #sideHead{flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:14px 0 8px}
#side.collapsed #libToggle{width:40px;height:40px;justify-content:center;padding:0;margin-left:0;border-radius:50%;color:#e7e7e7}
#side.collapsed #libToggle:hover{background:#ffffff14}
#side.collapsed #addBtn{display:grid;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#e7e7e7;transition:background .15s,color .15s}
#side.collapsed #addBtn:hover{background:#ffffff1f;color:#fff}
@media(max-width:820px){#sideHead #libToggle{pointer-events:none}}
@media(prefers-reduced-motion:reduce){#sideHead #libToggle,#side.collapsed #addBtn{transition:none}}
/* playlist heading: the action row pins to the top of the scroll area and
   shows a compact copy of the title once the big header has scrolled off */
#plactions{position:sticky;top:0;z-index:6;background:#121212;transition:box-shadow .2s}
#plactions.stuck{background:#121212f2;backdrop-filter:blur(12px);box-shadow:0 14px 34px #0007}
.plstick{display:none;flex:1;min-width:0;font-size:24px;font-weight:var(--font-weight-bold);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plactions.stuck .plstick{display:block}
@media(prefers-reduced-motion:reduce){#plactions{transition:none}}
/* Keep cover borders evenly inset and clip artwork at the same rounded edge. */
.pcover,.ccover,#plx,#nowc,.track-cover,#dfsArt,#fsArt{border:1px solid #ffffff18;overflow:hidden;background-clip:padding-box}
/* playback bar: the Spotify-style add-to-playlist control and its picker */
#nowp{position:relative}
.nowsave-wrap{position:relative;flex:none}
#nowsave{position:relative;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#b3b3b3;background:none;border:0;padding:0;transition:color .15s}
/* The disc is a layer of its own so hover can grow it without touching the
   glyph: scaling the button rendered the 16px icon at 16.8px and left the plus
   and the tick soft and off the pixel grid exactly while the pointer was on
   them. Growing the layer's inset instead keeps a crisp circle and leaves the
   glyph on its 26px, whole-pixel box. */
#nowsave:before{content:"";position:absolute;inset:0;border-radius:50%;background:#ffffff0f;border:1px solid #ffffff14;transition:inset .15s,background .15s,border-color .15s}
#nowsave>svg{position:relative;z-index:1}
#nowsave:hover{color:#fff}
#nowsave:hover:before{inset:-1px;background:#ffffff1c}
#nowsave.on{color:#1ed760}
#nowsave.on:before{background:transparent;border-color:#1ed760}
#nowsave.on:hover:before{background:#1ed76022;border-color:#3be477}
#nowsave:focus-visible{outline:2px solid #1ed760;outline-offset:2px}
.save-menu{position:absolute;left:0;bottom:calc(100% + 14px);width:276px;background:#181818;border:1px solid #ffffff17;border-radius:12px;box-shadow:0 24px 60px #000e;z-index:110;overflow:hidden;animation:settings-rise .18s cubic-bezier(.2,.8,.2,1)}
.save-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 8px 14px}
.save-head b{font-size:14px;font-weight:var(--font-weight-semibold)}
.save-close{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;color:#9a9a9a;transition:color .15s,background .15s}
.save-close:hover{color:#fff;background:#ffffff14}
.save-list{max-height:268px;overflow-y:auto;padding:0 6px 8px}
.save-list::-webkit-scrollbar{width:6px}
.save-list::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:6px}
.save-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 8px;border-radius:8px;color:#e9e9e9;font-size:14px;text-align:left;transition:background .13s}
.save-row:hover{background:#ffffff10}
.save-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-mark{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;color:#8f8f8f;border:1px solid #ffffff1f;transition:background .13s,border-color .13s,color .13s}
.save-row.in .save-mark{background:#1ed760;border-color:#1ed760;color:#07140a}
.save-empty{margin:0;padding:4px 10px 14px;font-size:12px;color:#8b8b8b;line-height:1.5}
@media(prefers-reduced-motion:reduce){.save-menu{animation:none}#nowsave,#nowsave:before,.save-close,.save-row,.save-mark{transition:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Nothing loaded: state toggles drop their green and the times hide, so the bar does not look live. */
#bar.idle .aicon.on{color:#b3b3b3}
#bar.idle .ptime{visibility:hidden}
.desktop-fullscreen.is-open{visibility:hidden}
/* Pressed feedback, one rule for every primary and transport control. */
.aicon:active,.fplay:active,#bigplay:active,#playb:active,.pill-cta:active,#homeBtn:active,.card:hover .card-play:active{transform:scale(.94)}
@media(min-width:1600px){.cardgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
/* Phone touch targets: last in the sheet so no later base rule shrinks them. */
@media(max-width:820px){#nowsave,#plactions .aicon,#fsBtns .aicon,#fsVol .aicon{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
