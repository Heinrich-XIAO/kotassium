<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Kotassium</title>
<link rel=manifest href=/manifest.webmanifest>
<link rel=apple-touch-icon href=/icons/apple-touch-icon.png>
<meta name=theme-color content="#121212">
<meta name=mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<style>
*{box-sizing:border-box}html,body{height:100%}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#root{flex:1;min-height:0;display:flex;flex-direction:column}
button{background:none;border:0;color:#fff;cursor:pointer;font-family:inherit}
input{background:none;border:0;color:#fff;font-family:inherit}
input:focus{outline:none}
svg{display:block}
#top{height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;background:#000;position:relative;z-index:5}
#homeBtn{width:48px;height:48px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;transition:transform .1s;flex:none}
#homeBtn:hover{transform:scale(1.06);background:#2a2a2a}
#searchwrap{background:#1f1f1f;border-radius:500px;height:48px;flex:1 1 480px;max-width:600px;display:flex;align-items:center;padding:0 14px;border:1px solid transparent}
#searchwrap:hover{background:#2a2a2a}
#searchwrap:focus-within{border-color:#ffffff4d;background:#242424}
#q{width:100%;min-width:0;font-size:15px;margin-left:8px}
#q::placeholder{color:#b3b3b3}
#qClear{display:none;width:24px;height:24px;border-radius:50%;background:#ffffff26;color:#fff;place-items:center;flex:none}
#qClear:hover{background:#ffffff40}
#searchwrap.filled #qClear{display:grid}
#qDiv{width:1px;height:24px;background:#ffffff26;flex:none;margin:0 4px 0 6px}
#qBrowse{width:32px;height:32px;border-radius:6px;color:#b3b3b3;display:grid;place-items:center;flex:none}
#qBrowse:hover{color:#fff;background:#ffffff14}
#mid{flex:1;display:flex;min-height:0;background:#121212;padding:8px;gap:8px}
#side{flex:0 0 262px;background:#121212;border-radius:8px;display:flex;flex-direction:column;min-height:0;transition:flex-basis .2s}
#main{flex:1;background:#121212;border-radius:8px;overflow-y:auto;position:relative}
#main,#sideList{scrollbar-width:none}
#main::-webkit-scrollbar,#sideList::-webkit-scrollbar{width:0}
#sideHead{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#sideHead #libBtn{display:grid;width:28px;height:28px;border-radius:50%;background:transparent;color:#b3b3b3;flex:none;padding:4px}
#sideHead #libBtn:hover{color:#fff;background:#ffffff14}
.top-lib{display:none!important}
#sideHead b{color:#b3b3b3;display:flex;align-items:center;gap:6px}
#addBtn{width:26px;height:26px;color:#b3b3b3;display:grid;place-items:center;cursor:pointer}
#addBtn:hover{color:#fff}
#collSide{width:26px;height:26px;color:#b3b3b3;display:grid;place-items:center;cursor:pointer;flex:none}
#collSide:hover{color:#fff}
#side.collapsed{flex:0 0 68px}
#side.collapsed #sideHead{justify-content:center;padding:12px 0}
#side.collapsed #sideHead #libBtn{display:grid!important}
#side.collapsed #sideHead b,#side.collapsed #addBtn{display:none}
#side.collapsed .pitem{justify-content:center;padding:6px 0;gap:0}
#side.collapsed .pmeta{display:none}
#side.collapsed .pcover{width:48px;height:48px}
#side.collapsed #empty{display:none}
#side.collapsed #addBox{display:none!important}
#sideList{flex:1;overflow-y:auto;padding:0 8px}
#side.collapsed #sideList::-webkit-scrollbar{width:0}
.pitem{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px;cursor:pointer}
.pitem:hover{background:#ffffff14}
.pitem.active{background:#ffffff1f}
.pcover{width:44px;height:44px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;position:relative;cursor:pointer}
.pitem:hover .pcover:after{content:"";position:absolute;inset:0;background:#0007;border-radius:inherit}
.pcoverPlay{position:absolute;inset:0;z-index:1;display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .12s}
.pitem:hover .pcoverPlay,.pcoverPlay:focus-visible{opacity:1}
#side.collapsed .pcoverPlay svg{width:22px;height:22px}
.pmeta{min-width:0}
.pmeta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:#b3b3b3;font-size:12px}
#addBox{padding:8px 12px;border-top:1px solid #292929}
#addBox input{width:100%;background:#2a2a2a;border-radius:6px;padding:10px;font-size:13px;box-sizing:border-box}
#addBox input::placeholder{color:#8a8a8a}
#homeView{padding:24px 32px}
#homeView h2{font-size:22px;margin:0 0 16px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#181818;border-radius:8px;padding:14px;cursor:pointer;transition:background .2s}
.card:hover{background:#282828}
.ccover{width:100%;aspect-ratio:1;border-radius:6px;position:relative}
.card b{display:block;font-size:15px;margin:10px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#b3b3b3;font-size:12px;display:block}
#cardPlay,.card-play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;transition:transform .2s;box-shadow:0 6px 16px #0008}
#cardPlay:hover,.card-play:hover{transform:scale(1.06)}
#plhead{padding:64px 32px 24px;display:flex;align-items:flex-end;gap:24px}
#plx{width:210px;height:210px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:56px;font-weight:800;color:#ffffffd9;box-shadow:0 8px 24px #0006}
.plinfo small{display:block;font-size:13px;font-weight:700}
.plinfo h1{font-size:clamp(40px,6vw,84px);margin:4px 0 8px;line-height:1;letter-spacing:-.04em;font-weight:900}
.plinfo p{color:#ffffffb3;font-size:13px;margin:0}
#plactions{display:flex;align-items:center;gap:28px;padding:20px 32px 12px}
#bigplay{width:56px;height:56px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;transition:transform .1s}
#bigplay:hover{transform:scale(1.05);background:#3be477}
#plactions svg{width:24px;height:24px}
.aicon{color:#b3b3b3;display:grid;place-items:center}
.aicon:hover{color:#fff}
.aicon.on{color:#1ed760}
#tbl{padding:0 32px 64px}
.tr-head,.row{display:grid;grid-template-columns:36px 4fr 2fr 60px;gap:14px;align-items:center;padding:4px 10px;border-radius:4px}
.tr-head{color:#b3b3b3;font-size:12px;border-bottom:1px solid #ffffff29;margin:0 0 8px;height:36px}
.tr-head span{line-height:36px}
.row{height:56px;cursor:default}
.row:hover{background:#ffffff12}
.trnum{color:#b3b3b3;font-variant-numeric:tabular-nums;font-size:15px}
.rt{min-width:0;display:flex;align-items:center;gap:12px}
.rtxt{min-width:0}
.rtxt b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtxt small{color:#b3b3b3;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ralb{color:#b3b3b3;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdura{color:#b3b3b3;font-variant-numeric:tabular-nums;text-align:right}
.row.playing .rtxt b,.srow.playing .rtxt b{color:#1ed760}
.row.playing .trnum{color:#1ed760}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:#1ed760;animation:b .9s ease infinite alternate}
.bars i:nth-child(2){animation-delay:.3s}.bars i:nth-child(3){animation-delay:.15s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes b{from{height:4px}to{height:14px}}
.srow{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:6px;height:56px}
.srow:hover{background:#ffffff12}
.stag{background:#333;color:#1ed760;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;align-self:center}
.rbtn{color:#b3b3b3}
.rbtn:hover{color:#fff}

/* --- Bottom bar --- */
#bar{height:76px;flex:none;background:#000;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 16px;gap:12px;transition:height .2s}
#bar.collapsed{height:52px;display:flex;align-items:center;gap:8px;padding:8px 12px;overflow:hidden}
#bar.collapsed #thumbstrip{min-width:0}
#bar.collapsed .barfull{display:none}
#bar .collbtn{width:32px;height:32px;border-radius:50%;background:#1f1f1f;color:#fff;display:grid;place-items:center;flex:none}
#thumbstrip{display:none;gap:6px;overflow-x:auto;flex:1;align-items:center}
#bar.collapsed #thumbstrip{display:flex}
#bar.collapsed .collbtn{display:grid}
.thumb{width:36px;height:36px;border-radius:4px;flex:none;background:#282828;cursor:pointer;position:relative}
.thumb.cur{outline:2px solid #1ed760}
.thumb:hover{transform:scale(1.06)}

#nowp{display:flex;align-items:center;gap:12px;min-width:0}
#nowc{width:52px;height:52px;border-radius:6px;background:#282828;flex:none}
#nowt{min-width:0}
#nowt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowt small{color:#b3b3b3;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctr{display:flex;flex-direction:column;align-items:center;gap:8px}
#btns{display:flex;align-items:center;gap:18px}
#playb{width:32px;height:32px;flex:none;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;transition:transform .06s}
#playb:hover{transform:scale(1.06)}
#btns button:disabled,#fsBtns button:disabled,#dfsBtn:disabled{opacity:.35;cursor:default;pointer-events:none}
#playb:disabled{opacity:.35;background:#fff;color:#000;transform:none;cursor:default}
#prow{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
.ptime{color:#b3b3b3;font-size:11px;min-width:34px;font-variant-numeric:tabular-nums}
#prog{flex:1;height:4px;background:#ffffff33;border-radius:2px;cursor:pointer;position:relative}
#progf{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px;width:0}
#prog:hover #progf{background:#1ed760}
#rside{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:#b3b3b3}
#vol{width:90px;height:16px;position:relative;cursor:pointer;background:linear-gradient(to bottom,transparent 6px,#ffffff33 6px,#ffffff33 10px,transparent 10px)}
#volf{position:absolute;left:0;top:6px;bottom:6px;background:#fff;border-radius:2px}
#vol.dragging #volf{background:#1ed760}
#fs{display:none}
#dfsArt,#fsArt,#nowc{background-size:cover!important;background-position:center!important}
.track-cover{width:40px;height:40px;border-radius:4px;flex:none;background-size:cover!important;background-position:center!important}
.rside,.volume-row{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#b3b3b3}
.volume-row{width:90px}
#vol{width:100%;height:16px}
.stream-only{font-size:10px;color:#b3b3b3}
/* toasts: one card style for every notification (modelled on "up next"),
   each dismissible by swiping it to the right */
.tcard{position:fixed;right:20px;background:#181818;color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:0 8px 24px #0009;border:1px solid #ffffff1f;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:280px;touch-action:none;user-select:none;-webkit-user-select:none}
#toast{bottom:88px;font-weight:600}
#upnext{top:88px;display:flex;align-items:center;gap:8px}
#upnext .upnext-label{font-size:11px;color:#b3b3b3;flex:none}
#upnext .upnext-art{width:36px;height:36px;border-radius:4px;flex:none;background-size:cover;background-position:center}
#upnext .upnext-copy{min-width:0}
#upnext .upnext-copy b,#upnext .upnext-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upnext .upnext-copy b{font-size:13px}#upnext .upnext-copy small{font-size:11px;color:#b3b3b3}
#upnext:not(.visible){opacity:0;pointer-events:none}
#upnext.visible{opacity:1;pointer-events:auto}
#dl{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#181818;border:1px solid #ffffff1f;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;display:none;align-items:center;gap:10px;z-index:99;min-width:280px;max-width:420px}
#dl.on{display:flex}
#dllabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
#dlbar{flex:1;height:4px;background:#ffffff26;border-radius:2px;overflow:hidden;min-width:80px}
#dlfill{display:block;height:100%;width:0;background:#1ed760;transition:width .2s}
#dlpct{color:#b3b3b3;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
#upd{margin-left:auto;height:48px;padding:0 14px;background:#1f1f1f;border:1px solid transparent;color:#fff;border-radius:500px;font-size:12px;display:none;align-items:center;gap:8px;flex:none;max-width:min(420px,45vw);min-width:0}
#upd.on{display:flex}
#updtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* the update pill is one morphing button: ⟳ check (idle) → ⟳ spinning → ⬇ download */
#updcheck{background:#2a2a2a;color:#b3b3b3;border:0;border-radius:50%;width:28px;height:28px;padding:0;display:none;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:color .15s,background .15s}
#updcheck:hover{color:#fff}
#updbtn{background:#2a2a2a;color:#b3b3b3;border:0;border-radius:50%;width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:color .15s,background .15s}
#updbtn:hover{color:#fff}
#updbtn.go{background:#1ed760;color:#000}
#updbtn:disabled{opacity:.6;cursor:default}
#updbtn.spin svg{animation:updspin .9s linear infinite}
@keyframes updspin{to{transform:rotate(360deg)}}
#upd.icononly{padding:0 10px;gap:0}
#upd:not(.icononly):hover{background:#2a2a2a}
#empty{color:#b3b3b3;padding:24px 8px;font-size:14px}
#empty h3{color:#fff;margin:0 0 6px}
#bigplayBtns{display:flex}
/* ---------------- full screen mode (desktop / web, not mobile) ---------------- */
#dfsBtn{display:grid;place-items:center}
#dfs{display:none}
body.dfs #dfs{display:flex;position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;background:linear-gradient(180deg,#1c1c1c,#0a0a0a 60%)}
#dfs.open{display:flex;position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#1c1c1c,#0a0a0a 60%)}
#dfs.open #dfsQueue{width:340px;flex:none;border-left:1px solid #ffffff14;background:#111;display:flex;flex-direction:column;min-height:0;overflow:auto}
#dfs.open #dfsArt{width:min(52vh,40vw);aspect-ratio:1;border-radius:8px;background:#282828;box-shadow:0 30px 80px #000c;flex:none}
#dfs.open #dfsMain{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
body.dfs.dfsidle #dfsTop{opacity:0;pointer-events:none}
body.dfs.dfsidle #dfsInfo{opacity:1}
body.dfs #bar{position:fixed;left:0;right:0;bottom:0;z-index:95;transition:opacity .3s}
body.dfs.dfsidle #bar{opacity:0;pointer-events:none}
#dfsMain{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#dfsArt{width:min(52vh,40vw);aspect-ratio:1;border-radius:8px;background:#282828;box-shadow:0 30px 80px #000c;flex:none}
#dfsTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:18px 24px;transition:opacity .3s}
body.dfs.dfsidle #dfsTop{opacity:0;pointer-events:none}
#dfsTopTitle{flex:1;min-width:0;font-size:14px;font-weight:700;color:#b3b3b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dfsExit{width:40px;height:40px;border-radius:50%;background:#ffffff14;color:#e5e5e5;display:grid;place-items:center;flex:none;border:0;cursor:pointer}
#dfsExit:hover{background:#ffffff26;color:#fff}
#dfsInfo{position:absolute;left:32px;bottom:32px;max-width:60%;opacity:0;transition:opacity .3s}
body.dfs.dfsidle #dfsInfo{opacity:1}
#dfsExit{width:40px;height:40px;border-radius:50%;background:#ffffff14;color:#e5e5e5;display:grid;place-items:center;flex:none;border:0;cursor:pointer}
#dfsTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
#dfsTopTitle{flex:1;min-width:0;font-size:14px;font-weight:700;color:#b3b3b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dfsInfo{position:absolute;left:32px;bottom:32px;max-width:60%;opacity:0;transition:opacity .3s}
#dfsInfo b{display:block;font-size:30px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dfsInfo small{display:block;font-size:17px;color:#b3b3b3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dfsExit{width:40px;height:40px;border-radius:50%;background:#ffffff14;color:#e5e5e5;display:grid;place-items:center;flex:none;border:0;cursor:pointer}
#dfsExit:hover{background:#ffffff26;color:#fff}
#dfsQueue{width:340px;flex:none;border-left:1px solid #ffffff14;background:#111;display:flex;flex-direction:column;min-height:0}
#dfsQueue #dfsQrows{display:block!important;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px}
#dfsQhead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 4px}
#dfsQhead b{font-size:16px;font-weight:800}
#dfsQhead span{font-size:12px;color:#8a8a8a}
.dfsQsect{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a8a;font-weight:700;padding:16px 20px 6px}
.dfsQrow{display:flex;align-items:center;gap:12px;padding:8px 20px;cursor:pointer}
.dfsQrow:hover{background:#ffffff0a}
.dfsQrow.cur b{color:#1ed760}
.dfsQcov{width:40px;height:40px;border-radius:4px;flex:none;background:#282828;background-size:cover;background-position:center}
.dfsQt{min-width:0;flex:1}
.dfsQt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfsQt small{display:block;font-size:12px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dfsQrows{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px}
#dfsQueue #dfsQrows{display:block!important}
/* mobile */
#libBtn{display:none;width:48px;height:48px;border-radius:50%;background:#1f1f1f;flex:none;place-items:center}
.top-lib{display:grid!important}
#sideHead #libBtn{display:none!important}
@media(max-width:820px){
body{-webkit-tap-highlight-color:transparent}
#libBtn{display:grid}
#dfsBtn{display:none}
#collSide{display:none}
#searchwrap{flex:1 1 auto;min-width:0}
#qDiv,#qBrowse{display:none}
#sideHead #libBtn{display:none!important}
.top-lib{display:grid!important}
#mid{position:relative;padding:4px}
#side{position:absolute;z-index:30;left:4px;top:4px;bottom:4px;width:280px;display:none;background:#181818;border-radius:8px;box-shadow:0 12px 32px #000d;flex:none;touch-action:pan-y pinch-zoom}
#side.open{display:flex}
#side.collapsed{left:auto;right:auto;width:68px;flex:none}
#homeView{padding:16px}
#plhead{padding:32px 16px 16px;gap:16px;align-items:center}
#plx{width:120px;height:120px;font-size:40px}
#plinfo h1{font-size:clamp(30px,9vw,56px)}
#plactions{padding:12px 16px;gap:20px}
#tbl{padding:0 12px 56px}
.tr-head,.row{grid-template-columns:28px 1fr 52px;gap:8px;padding:4px 6px}
.tr-head span:nth-child(3){display:none}
.row .ralb{display:none}
#bar{grid-template-columns:1fr auto 1fr;padding:0 8px;gap:8px}
#rside{justify-content:center}
#rside .volume-row{width:auto}
#rside .volume-row .aicon,#rside .volume-row #vol{display:none}
#rside #dfsBtn{display:none}
#nowp{min-width:0}
#nowc{width:40px;height:40px}
#nowt b{font-size:13px}#nowt small{font-size:11px}
#btns{gap:8px}
#btns button{padding:4px}
#btns .aicon svg{width:17px;height:17px}
#btns button[aria-label="Radio"],#btns button[aria-label="Collapse player"]{display:none}
#playb{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#prow{max-width:none}
.ptime{min-width:28px;font-size:10px}
#rside #vol{width:52px}
#toast{bottom:96px}
/* fullscreen player: tap the thumbnail or swipe the bar up */
#nowc{cursor:pointer}

/* the control buttons are flex:none so they never squash into an ellipse;
   on the narrowest phones the gap shrinks instead to keep the row inside */
@media(max-width:360px){#fsBtns{gap:16px}}
#fsQueue{display:none}
#dfsQueue{display:none}
@media(max-width:820px){#fsQueue{display:block}#dfsQueue{display:flex}}
body.dfs #dfsQueue{display:flex}
#toast.visible,#upnext.visible{opacity:1;pointer-events:auto}
#upnext{top:88px}
/* settings */
#settingsBtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#a5a5a5;flex:none;transition:color .16s,background .16s}
#settingsBtn:hover{color:#fff;background:#ffffff12}
.settings-backdrop{position:fixed;inset:0;z-index:120;background:#000b;backdrop-filter:blur(9px);display:grid;place-items:center;padding:24px;animation:settings-fade .18s ease-out}
.settings-dialog{width:min(560px,100%);max-height:min(760px,calc(100dvh - 48px));overflow:auto;background:#151515;border:1px solid #ffffff1b;border-radius:18px;box-shadow:0 32px 100px #000d;color:#f5f5f5;animation:settings-rise .24s cubic-bezier(.2,.8,.2,1)}
@keyframes settings-fade{from{opacity:0}to{opacity:1}}

.settings-head{display:flex;align-items:center;justify-content:space-between;padding:28px 30px 22px;border-bottom:1px solid #ffffff12}

.settings-content{padding:6px 30px 18px}
.settings-section{padding:22px 0 8px}
.settings-section+.settings-section{border-top:1px solid #ffffff12}
.settings-section-title{display:flex;align-items:flex-start;gap:13px;margin:0 0 12px}
