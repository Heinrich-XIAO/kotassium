<style>
*{box-sizing:border-box}html,body{height:100%}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{background:none;border:0;color:#fff;cursor:pointer;font-family:inherit}
input{background:none;border:0;color:#fff;font-family:inherit}
input:focus{outline:none}
svg{display:block}
#top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);position:relative;z-index:5}
#homeBtn{width:40px;height:40px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;transition:transform .1s}
#homeBtn:hover{transform:scale(1.06);background:#2a2a2a}
#searchwrap{background:#242424;border-radius:500px;height:44px;flex:0 1 440px;display:flex;align-items:center;padding:0 12px;border:1px solid transparent}
#searchwrap:hover{background:#2a2a2a}
#searchwrap:focus-within{border-color:#ffffff60;background:#1f1f1f}
#q{width:100%;font-size:15px;margin-left:8px}
#q::placeholder{color:#b3b3b3}
#mid{flex:1;display:flex;min-height:0;background:#121212;padding:8px;gap:8px}
#side{flex:0 0 262px;background:#121212;border-radius:8px;display:flex;flex-direction:column;min-height:0;transition:flex-basis .2s}
#main{flex:1;background:#121212;border-radius:8px;overflow-y:auto;position:relative}
#main,#sideList{scrollbar-width:none}
#main::-webkit-scrollbar,#sideList::-webkit-scrollbar{width:0}
#main::-webkit-scrollbar-thumb,#sideList::-webkit-scrollbar-thumb{background:#ffffff40;border-radius:6px}
#sideHead{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#sideHead b{color:#b3b3b3;display:flex;align-items:center;gap:6px}
#addBtn{width:26px;height:26px;color:#b3b3b3;display:grid;place-items:center;cursor:pointer}
#addBtn:hover{color:#fff}
#collSide{width:26px;height:26px;color:#b3b3b3;display:grid;place-items:center;cursor:pointer;flex:none}
#collSide:hover{color:#fff}
#side.collapsed{flex:0 0 68px}
#side.collapsed #sideHead{justify-content:center;padding:12px 0}
#side.collapsed #sideHead b,#side.collapsed #addBtn{display:none}
#side.collapsed .pitem{justify-content:center;padding:6px 0;gap:0}
#side.collapsed .pmeta{display:none}
#side.collapsed .pcover{width:48px;height:48px}
#side.collapsed #empty{display:none}
#side.collapsed #addBox{display:none!important}
#sideList{flex:1;overflow-y:auto;padding:0 8px}
#side.collapsed #sideList::-webkit-scrollbar{width:0}
.pitem{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px;cursor:pointer}
.pitem:hover{background:#ffffff14}
.pitem.active{background:#ffffff1f}
.pcover{width:44px;height:44px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px}
.pmeta{min-width:0}
.pmeta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:#b3b3b3;font-size:12px}
#addBox{padding:8px 12px;border-top:1px solid #292929}
#addBox input{width:100%;background:#2a2a2a;border-radius:6px;padding:10px;font-size:13px;box-sizing:border-box}
#addBox input::placeholder{color:#8a8a8a}
#homeView{padding:24px 32px}
#homeView h2{font-size:22px;margin:0 0 16px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#181818;border-radius:8px;padding:14px;cursor:pointer;transition:background .2s}
.card:hover{background:#282828}
.ccover{width:100%;aspect-ratio:1;border-radius:6px;position:relative}
.card b{display:block;font-size:15px;margin:10px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#b3b3b3;font-size:12px;display:block}
#cardPlay{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;opacity:0;visibility:hidden;transition:all .2s;box-shadow:0 6px 16px #0008}
.card:hover #cardPlay{opacity:1;visibility:visible}
#cardPlay:hover{transform:scale(1.06)}
#plhead{padding:64px 32px 24px;display:flex;align-items:flex-end;gap:24px}
#plx{width:210px;height:210px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:56px;font-weight:800;color:#ffffffd9;box-shadow:0 8px 24px #0006}
.plinfo small{display:block;font-size:13px;font-weight:700}
.plinfo h1{font-size:clamp(40px,6vw,84px);margin:4px 0 8px;line-height:1;letter-spacing:-.04em;font-weight:900}
.plinfo p{color:#ffffffb3;font-size:13px;margin:0}
#plactions{display:flex;align-items:center;gap:28px;padding:20px 32px 12px}
#bigplay{width:56px;height:56px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;transition:transform .1s}
#bigplay:hover{transform:scale(1.05);background:#3be477}
#plactions svg{width:24px;height:24px}
.aicon{color:#b3b3b3;display:grid;place-items:center}
.aicon:hover{color:#fff}
.aicon.on{color:#1ed760}
#tbl{padding:0 32px 64px}
.tr-head,.row{display:grid;grid-template-columns:36px 4fr 2fr 1.6fr 60px;gap:14px;align-items:center;padding:4px 10px;border-radius:4px}
.tr-head{color:#b3b3b3;font-size:12px;border-bottom:1px solid #ffffff29;margin:0 0 8px;height:36px}
.tr-head span{line-height:36px}
.row{height:56px;cursor:default}
.row:hover{background:#ffffff12}
#tr-num{color:#b3b3b3;font-variant-numeric:tabular-nums;font-size:15px}
.rt{min-width:0;display:flex;align-items:center;gap:12px}
.rtxt{min-width:0}
.rtxt b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtxt small{color:#b3b3b3;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ralb{color:#b3b3b3;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdura{color:#b3b3b3;font-variant-numeric:tabular-nums;text-align:right}
.row.playing .rtxt b,#row.playing #tr-num{color:#1ed760}
.row.playing #tr-num{color:#1ed760}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:#1ed760;animation:b .9s ease infinite alternate}
.bars i:nth-child(2){animation-delay:.3s}.bars i:nth-child(3){animation-delay:.15s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes b{from{height:4px}to{height:14px}}
.srow{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:6px;height:56px}
.srow:hover{background:#ffffff12}
.stag{background:#333;color:#1ed760;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;align-self:center}
.rbtn{color:#b3b3b3}
.rbtn:hover{color:#fff}

/* --- Bottom bar --- */
#bar{height:76px;flex:none;background:#000;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 16px;gap:12px;transition:height .2s}
#bar.collapsed{height:52px;display:flex;align-items:center;gap:8px;padding:8px 12px;overflow:hidden}
#bar.collapsed .barfull{display:none}
#bar .collbtn{width:32px;height:32px;border-radius:50%;background:#1f1f1f;color:#fff;display:grid;place-items:center;flex:none}
#thumbstrip{display:none;gap:6px;overflow-x:auto;flex:1;align-items:center}
#bar.collapsed #thumbstrip{display:flex}
.thumb{width:36px;height:36px;border-radius:4px;flex:none;background:#282828;cursor:pointer;position:relative}
.thumb.cur{outline:2px solid #1ed760}
.thumb:hover{transform:scale(1.06)}

#nowp{display:flex;align-items:center;gap:12px;min-width:0}
#nowc{width:52px;height:52px;border-radius:6px;background:#282828;flex:none}
#nowt{min-width:0}
#nowt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowt small{color:#b3b3b3;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctr{display:flex;flex-direction:column;align-items:center;gap:8px}
#btns{display:flex;align-items:center;gap:18px}
#playb{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;transition:transform .06s}
#playb:hover{transform:scale(1.06)}
#prow{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
.ptime{color:#b3b3b3;font-size:11px;min-width:34px;font-variant-numeric:tabular-nums}
#prog{flex:1;height:4px;background:#ffffff33;border-radius:2px;cursor:pointer;position:relative}
#progf{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px;width:0}
#prog:hover #progf{background:#1ed760}
#rside{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:#b3b3b3}
#vol{width:90px;height:16px;position:relative;cursor:pointer;background:linear-gradient(to bottom,transparent 6px,#ffffff33 6px,#ffffff33 10px,transparent 10px)}
#volf{position:absolute;left:0;top:6px;bottom:6px;background:#fff;border-radius:2px}
#vol.dragging #volf{background:#1ed760}
#fs{display:none}
#toast{position:fixed;bottom:88px;right:20px;background:#1db954;color:#000;font-weight:600;padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99}
#upnext{position:fixed;top:88px;right:20px;background:#181818;color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:260px}
#dl{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#181818;border:1px solid #ffffff1f;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;display:none;align-items:center;gap:10px;z-index:99;min-width:280px;max-width:420px}
#dl.on{display:flex}
#dllabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
#dlbar{flex:1;height:4px;background:#ffffff26;border-radius:2px;overflow:hidden;min-width:80px}
#dlfill{display:block;height:100%;width:0;background:#1ed760;transition:width .2s}
#dlpct{color:#b3b3b3;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
#upd{position:fixed;top:64px;right:20px;background:#181818;border:1px solid #ffffff1f;color:#fff;padding:7px 8px 7px 14px;border-radius:8px;font-size:12px;display:none;align-items:center;gap:10px;z-index:100;box-shadow:0 6px 20px #0008;max-width:420px}
#upd.on{display:flex}
#updtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#updbtn{background:#1ed760;color:#000;border:0;border-radius:999px;padding:5px 12px;font:inherit;font-weight:700;cursor:pointer;flex:none}
#updbtn:disabled{opacity:.6;cursor:default}
#empty{color:#b3b3b3;padding:24px 8px;font-size:14px}
#empty h3{color:#fff;margin:0 0 6px}
#bigplayBtns{display:flex}
/* mobile */
#libBtn{display:none;width:40px;height:40px;border-radius:50%;background:#1f1f1f;flex:none;place-items:center}
@media(max-width:820px){
body{-webkit-tap-highlight-color:transparent}

#collSide{display:none}
#searchwrap{flex:1 1 auto;min-width:0}
#mid{position:relative;padding:4px}
#side{position:absolute;z-index:30;left:4px;top:4px;bottom:4px;width:280px;display:none;background:#181818;border-radius:8px;box-shadow:0 12px 32px #000d;flex:none}
#side.open{display:flex}
#side.collapsed{left:auto;right:auto;width:68px;flex:none}
#homeView{padding:16px}
#plhead{padding:32px 16px 16px;gap:16px;align-items:center}
#plx{width:120px;height:120px;font-size:40px}
#plinfo h1{font-size:clamp(30px,9vw,56px)}
#plactions{padding:12px 16px;gap:20px}
#tbl{padding:0 12px 56px}
.tr-head,.row{grid-template-columns:28px 1fr 52px;gap:8px;padding:4px 6px}
.tr-head span:nth-child(3),.tr-head span:nth-child(4){display:none}
.row .ralb{display:none}
#bar{grid-template-columns:1fr auto 1fr;padding:0 8px;gap:8px}
#rside{justify-content:center}
#nowp{min-width:0}
#nowc{width:40px;height:40px}
#nowt b{font-size:13px}#nowt small{font-size:11px}
#btns{gap:10px}
#playb{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#prow{max-width:none}
.ptime{min-width:28px;font-size:10px}
#rside #vol{width:52px}
#toast{bottom:96px}
/* fullscreen player: tap the thumbnail or swipe the bar up */
#nowc{cursor:pointer}
#fs.on{display:flex;position:fixed;left:0;top:0;right:0;bottom:0;z-index:80;background:linear-gradient(180deg,#232323,#0b0b0b 50%);flex-direction:column;gap:12px;padding:8px 20px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
#fsGrip{width:44px;height:5px;border-radius:3px;background:#ffffff40;margin:2px auto 0;flex:none}
#fsHead{display:flex;align-items:center;gap:10px;flex:none}
#fsClose{width:40px;height:40px;border-radius:50%;background:#ffffff1f;color:#fff;display:grid;place-items:center;flex:none}
#fsPl{flex:1;min-width:0;text-align:center;color:#b3b3b3;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fsHeadpad{width:40px;flex:none}
#fsArt{width:min(74vw,34vh);aspect-ratio:1;border-radius:10px;background:#282828;margin:6px auto 0;flex:none;box-shadow:0 18px 50px #000b}
#fsTxt{text-align:center;min-width:0;flex:none;padding:0 6px}
#fsTxt b{display:block;font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fsTxt small{display:block;color:#b3b3b3;font-size:15px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fsSeek{display:flex;align-items:center;gap:12px;flex:none;touch-action:none}
#fsSeek .ptime{font-size:12px;min-width:38px;color:#b3b3b3;font-variant-numeric:tabular-nums}
#fsProg{flex:1;height:28px;position:relative;cursor:pointer;touch-action:none}
#fsProg::before{content:'';position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:#ffffff33;border-radius:3px}
#fsProgf{position:absolute;left:0;top:calc(50% - 3px);height:6px;background:#fff;border-radius:3px;width:0}
#fsProg:active #fsProgf{background:#1ed760}
#fsBtns{display:flex;align-items:center;justify-content:center;gap:22px;flex:none}
#fsBtns .aicon svg{width:26px;height:26px}
#fsPlay{width:60px;height:60px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transition:transform .06s}
#fsPlay:hover{transform:scale(1.05)}
#fsVol{display:flex;align-items:center;gap:12px;flex:none;touch-action:none}
#fsVol .aicon svg{width:24px;height:24px}
#fsVolBar{flex:1;height:28px;position:relative;cursor:pointer;touch-action:none}
#fsVolBar::before{content:'';position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:#ffffff33;border-radius:3px}
#fsVolFill{position:absolute;left:0;top:calc(50% - 3px);height:6px;background:#fff;border-radius:3px;width:0}
#fsVolBar:active #fsVolFill{background:#1ed760}}
</style></head><body>
<div id=top>

</div>
</div>
</div>

<div id=fsGrip></div>
<div id=fsHead><button id=fsClose onclick=closeFs() title="Collapse player"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M3 6l5 5 5-5H3z"/></svg></button><span id=fsPl></span><span id=fsHeadpad></span></div>

function esc(s){return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<')}
function fmt(ms){ms=Number(ms)||0;var s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function secs(s){s=Number(s)||0;return Math.floor(s/60)+':'+String(Math.round(s)%60).padStart(2,'0')}
var toast=(function(){var t=document.getElementById('toast'),h=0;
  return function(m){t.textContent=m;t.style.opacity=1;clearTimeout(h);h=setTimeout(function(){t.style.opacity=0},3000)}})();
function hue(name){var h=0;name=String(name||'?');for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return h%360}
function gcss(name){if(!name)return 'linear-gradient(135deg,#333,#555)';

/* cover caching: client fetches image, POSTs to server, rewrites UI */
var _coverCache={};
function postJSON(u,o){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){return r.json()})}
/* ---------------- download jobs ---------------- */
function showDl(label,pct,status){
  var d=document.getElementById('dl');if(!d)return;
  d.classList.add('on');
  document.getElementById('dllabel').textContent=(status==='done'?'ready: ':status==='error'?'failed: ':'downloading ')+(label||'');
  document.getElementById('dlpct').textContent=Math.round(pct||0)+'%';
  document.getElementById('dlfill').style.width=Math.max(0,Math.min(100,pct||0))+'%';
}
function hideDl(){var d=document.getElementById('dl');if(d)d.classList.remove('on')}
var _dlActive=null;
function dlJob(id,label,quiet){
  return API('/api/ytdl?id='+encodeURIComponent(id)).then(function(j){
    if(j.error)throw new Error(j.error);
    if(j.file)return j;
    if(!j.job)throw new Error('no job');
    var mine=j.job;
    function done(){if(!quiet&&_dlActive===mine){_dlActive=null;hideDl()}}
    return new Promise(function(res,rej){
      (function tick(){
        API('/api/job?id='+j.job).then(function(s){
          if(!s||s.error){done();return rej(new Error('job lost'))}
          if(!quiet){
            if(_dlActive===null)_dlActive=mine;
            if(_dlActive===mine&&s.status!=='done'&&s.status!=='error')
              showDl(label||s.label,s.pct,s.status);
          }
          if(s.status==='done'){done();res({file:s.file})}
          else if(s.status==='error'){done();rej(new Error(s.error||'download failed'))}
          else setTimeout(tick,350);
        },function(){setTimeout(tick,800)});
      })();
    });
  });
}
/* ---------------- now playing (desktop MPRIS / notifications) ---------------- */
var _npKey='',_npAt=0;
function reportNow(state,tr){
  tr=tr||Q[QI];if(!tr)return;
  state=state||(AU.paused?'paused':'playing');
  var now=Date.now(),key=[tr.t,tr.a,state].join('|');
  if(key===_npKey&&now-_npAt<2500)return;
  _npKey=key;_npAt=now;
  postJSON('/api/nowplaying',{t:tr.t||'',a:tr.a||'',album:tr.album||'',cover:tr.cover||'',
    ms:tr.ms||0,pos:Math.round((AU.currentTime||0)*1000),state:state}).catch(function(){});
}
function cacheCover(url){
  if(!url||url.indexOf('/cover/')===0){return Promise.resolve(null)}
  if(_coverCache[url]==='pending')return Promise.resolve(null);
  if(_coverCache[url])return Promise.resolve(_coverCache[url]);
  _coverCache[url]='pending';
  return fetch(url,{mode:'cors'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.blob()})
    .then(function(b){return new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(){res(rd.result.split(',')[1])};rd.onerror=rej;rd.readAsDataURL(b)})})
    .then(function(b64){return postJSON('/api/cover/cache',{url:url,data:b64})})
    .then(function(j){if(j&&j.file){_coverCache[url]=j.file;rewriteCover(url,j.file)};return j&&j.file})
    .catch(function(e){_coverCache[url]=null;return null});
}
function rewriteCover(url,key){
  document.querySelectorAll('[data-cover-url]').forEach(function(el){
    if(el.getAttribute('data-cover-url')===url){
      el.style.background='url("/cover/'+key+'") center/cover no-repeat';
      el.removeAttribute('data-cover-url')}})}
function coverBg(url){
  if(!url)return 'linear-gradient(135deg,#333,#555)';
  var k=_coverCache[url];if(k&&k!=='pending')return 'url("/cover/'+k+'") center/cover no-repeat';
  setTimeout(function(){cacheCover(url)},0);
  return 'url("'+url+'") center/cover no-repeat';
}

function addLink(){

function card(p){return ''}

  '<button id=bigplay onclick=playT(0,true) title="Play"><svg viewBox="0 0 16 16" fill="currentColor" style="width:22px;height:22px"><path d="M5 3v10l7-5-7-5z"/></svg></button>'+
  '<button class=aicon id=shuf2 onclick=toggleShuffle() title="Shuffle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>'+

  '</div>'+

  var t=document.getElementById('tbl');
  tracks.forEach(function(tr,i){

/* ---------------- search ---------------- */
function doSearch(){
  var q=document.getElementById('q').value.trim();if(!q)return;
  var m=document.getElementById('main');
  m.innerHTML='<div id=homeView><h2>Searching \u201c'+esc(q)+'\u201d...</h2></div>';
  API('/api/search?q='+encodeURIComponent(q)).then(function(j){
    var res=(j.results||[]);
    m.innerHTML='<div id=homeView><h2>Results for \u201c'+esc(q)+'\u201d</h2></div><div id=tbl style="padding-top:0"><div class=tr-head><span></span><span>Title</span><span>Source</span><span></span><span></span></div></div>';

      '<span class=stag>'+esc(tr.source||'')+'</span>'+(tr.full===false?'<span style="color:#b3b3b3;font-size:11px">stream only</span>':'<span></span>')+'<span></span><span></span>';

/* ---------------- player ---------------- */
function markActive(){
  document.querySelectorAll('#tbl .row,#srowrow').forEach(function(r){
    var i=Number(r.dataset.i);var isPL=(PLAYING_PL===curViewName());
    var on=(isPL&&i===qi_view());
    r.classList.toggle('playing',!!on);
    var n=r.querySelector('#tr-num');
    if(!n)return;
    if(on){n.innerHTML='<span class=bars style="display:inline-flex"><i></i><i></i><i></i><i></i></span>'}
    else{n.textContent=(i+1)}});
}
var _curViewName='';
function curViewName(){return _curViewName}
function qi_view(){return (PLAYING_PL===_curViewName)?QI:-1}
var QI=-1;
var SHUFFLE_ORDER=[];var SHUFFLE_POS=0;
function rebuildShuffle(){if(!Q.length){SHUFFLE_ORDER=[];return}SHUFFLE_ORDER=[];var idxs=[];for(var i=0;i<Q.length;i++)if(i!==QI)idxs.push(i);for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t}SHUFFLE_ORDER=idxs;SHUFFLE_POS=0}
function nextIndex(){if(REPEAT===2)return QI;if(SHUF&&Q.length>1){if(!SHUFFLE_ORDER.length||SHUFFLE_POS>=SHUFFLE_ORDER.length)rebuildShuffle();return SHUFFLE_ORDER[SHUFFLE_POS]}if(QI+1<Q.length)return QI+1;if(REPEAT===1&&Q.length)return 0;return -1}
function playT(i,setQ){
  if(!PL||!PL[i])return;
  if(setQ)Q=PL.slice();
  QI=i; if(SHUF)rebuildShuffle(); playTrack(PL[i])
}
function showNow(tr){
  var nt=document.getElementById('nowt');
  nt.querySelector('b').textContent=tr.t||'';
  nt.querySelector('small').textContent=tr.a||'';

  else{c.style.background=gcss(tr.t);c.removeAttribute('data-cover-url')}
  reportNow('playing',tr);
  syncFs();
}
function meta(t){if('mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:t.t||'?',artist:t.a||'',album:t.album||''})}catch(e){}}
function setPausedIcon(p){
  var h=p?'<path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z" transform="translate(0.6 0)"/>':'<path d="M5.7 3a.7.7 0 0 0-.7.7v10.6a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V3.7a.7.7 0 0 0-.7-.7H5.7zm4.8 0a.7.7 0 0 0-.7.7v10.6a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V3.7a.7.7 0 0 0-.7-.7h-1.6z"/>';
  document.getElementById('pbIcon').innerHTML=h;
  var f=document.getElementById('fsPlayIcon');if(f)f.innerHTML=h}
function playTrack(tr){
  if(!tr)return;
  showNow(tr);meta(tr);markActive();
  if(tr.source==='youtube'){return localResolve(tr,true)}
  if(tr.source&&tr.source!=='local'){
    var u='/api/play?src='+tr.source+'&id='+tr.id;
    if(tr.preview)u+='&preview='+encodeURIComponent(tr.preview);
    AU.src=u;AU.play();return
  }
  localResolve(tr,true);
}
function stopSrc(){try{AU.pause()}catch(e){}try{AU.removeAttribute('src');AU.load()}catch(e){}}
/* Switch from the 5s preview to the full file. Setting src + currentTime +
   play() in one go can leave WebKit paused (the clock freezes at the swap
   point), so wait for metadata, then seek and play. */
function swapTo(src,at){
  var done=false;
  function go(){
    if(done)return;done=true;
    AU.removeEventListener('loadedmetadata',go);
    try{if(at>0)AU.currentTime=at}catch(e){}
    AU.play().catch(function(){setTimeout(function(){AU.play().catch(function(){})},300)});
    schedulePrefetch();
  }
  AU.addEventListener('loadedmetadata',go);
  AU.src=src;
  if(AU.readyState>=1)go();
  setTimeout(go,1500);
}
/* the current track is fully up and running now - fetch the next one soon */
function schedulePrefetch(){
  if(_pfTimer)clearTimeout(_pfTimer);
  var at=QI;
  _pfTimer=setTimeout(function(){
    _pfTimer=null;
    if(QI!==at)return; /* the user skipped; the new track schedules its own */
    var n=nextIndex();if(n>=0&&Q[n])prefetch(Q[n])},5000)}
var _cache={};try{var _c=JSON.parse(localStorage.getItem('kot_ytcache')||'{}');for(var k in _c)_cache[k]=_c[k]}catch(e){}
function localResolve(tr,fresh){
  stopSrc();setPausedIcon(true);
  var key=(tr.t||'')+'|'+(tr.a||'');
  var cached=_cache[key];
  if(cached){
