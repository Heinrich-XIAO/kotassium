<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Kotassium</title>
<link rel=manifest href=/manifest.webmanifest>
<link rel=apple-touch-icon href=/icons/apple-touch-icon.png>
<meta name=theme-color content="#121212">
<meta name=mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<style>
*{box-sizing:border-box}html,body{height:100%}
:root{--font-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-size-body:14px;--font-size-title:24px;--font-size-section:12px;--font-weight-regular:400;--font-weight-medium:500;--font-weight-semibold:600;--font-weight-bold:700;--font-weight-heavy:800;--text:#fff;--text-2:#b3b3b3;--text-3:#8a8a8a;--hero-cover:clamp(160px,14vw,232px);--accent:#1ed760;--accent-hover:#3be477;--font-size-display:64px;--font-size-hero:40px}
h1,h2,h3{font-family:var(--font-ui);font-weight:var(--font-weight-bold);letter-spacing:-.02em}
h2{font-size:var(--font-size-title)}
h3{font-size:16px}
body{background:#000;color:var(--text);font-family:var(--font-ui);font-size:var(--font-size-body);font-weight:var(--font-weight-regular);margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#root{flex:1;min-height:0;display:flex;flex-direction:column}
button{background:none;border:0;color:var(--text);cursor:pointer;font-family:inherit}
input{background:none;border:0;color:var(--text);font-family:inherit}
input:focus{outline:none}
button:focus-visible,[role=button]:focus-visible,[role=link]:focus-visible,[role=slider]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#top{height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:8px;background:#000;position:relative;z-index:5}
#homeBtn{width:48px;height:48px;border-radius:50%;background:#1f1f1f;display:grid;place-items:center;transition:transform .15s;flex:none}
#homeBtn:hover{transform:scale(1.04);background:#2a2a2a}
#searchwrap{background:#1f1f1f;border-radius:999px;height:48px;flex:1 1 480px;max-width:600px;display:flex;align-items:center;padding:0 16px;border:1px solid transparent}
#searchwrap:hover{background:#2a2a2a}
#searchwrap:focus-within{border-color:var(--accent);background:#242424}
#q{width:100%;min-width:0;font-size:16px;margin-left:8px}
#q::placeholder{color:var(--text-2)}
#qClear{display:none;width:24px;height:24px;border-radius:50%;background:#ffffff26;color:var(--text);place-items:center;flex:none}
#qClear:hover{background:#ffffff40}
#searchwrap.filled #qClear{display:grid}
/* Spotify-style islands: black shell, rounded panels, and the gutter between
   them is the drag affordance instead of a painted handle bar. */
#mid{flex:1;display:flex;min-height:0;background:#000;padding:8px;gap:8px}
#side{flex:0 0 262px;background:#121212;border-radius:8px;display:flex;flex-direction:column;min-height:0;transition:flex-basis .2s}
#mid.resizing #side{transition:none}
#sideResize{position:relative;z-index:2;width:8px;flex:none;margin:0 -8px;cursor:col-resize;touch-action:none;border-radius:8px;transition:background .15s}
#sideResize:hover,#mid.resizing #sideResize{background:#ffffff1a}
#sideResize:focus-visible{outline:2px solid var(--accent);outline-offset:0}
#main{flex:1;background:#121212;border-radius:8px;overflow-y:auto;position:relative}
#main,#sideList{scrollbar-width:none}
#main::-webkit-scrollbar,#sideList::-webkit-scrollbar{width:0}
#sideHead{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#sideHead #libBtn{display:grid;width:28px;height:28px;border-radius:50%;background:transparent;color:var(--text-2);flex:none;padding:4px}
#sideHead #libBtn:hover{color:var(--text);background:#ffffff14}
.top-lib{display:none!important}
#sideHead b{color:var(--text-2);display:flex;align-items:center;gap:8px;font-weight:var(--font-weight-bold)}
/* padding:0 matters: the shared button padding (1px 6px) leaves a 14px content
   box for a 17px glyph, so the icon could only centre inside the content box
   and sat 1.5px right of the button's centre. */
#addBtn{width:32px;height:32px;color:var(--text-2);display:grid;place-items:center;cursor:pointer;padding:0}
#addBtn:hover{color:var(--text)}
#collSide{width:26px;height:26px;color:var(--text-2);display:grid;place-items:center;cursor:pointer;flex:none}
#collSide:hover{color:var(--text)}
#side.collapsed{flex:0 0 68px}
#side.collapsed #sideHead{justify-content:center;padding:12px 0}
#side.collapsed #sideHead #libBtn{display:grid!important}
#side.collapsed #sideHead b,#side.collapsed #addBtn{display:none}
/* The hover/active pill is the only border a collapsed row shows, so it has to
   surround the cover evenly: 6px top and bottom against 2px at the sides read
   as a thick bar above and below the artwork. 2px + a 48px cover fills the
   52px the collapsed list gives us, exactly, and the margin puts back the
   vertical rhythm the padding used to provide (2+4+4+2 = the 12px gap between
   covers the old 6px padding gave). */
#side.collapsed .pitem{justify-content:center;padding:2px;margin:4px 0 8px;gap:0}
#side.collapsed .pmeta{display:none}
#side.collapsed .pcover{width:48px;height:48px}
#side.collapsed #empty{display:none}
#sideList{flex:1;overflow-y:auto;padding:0 8px}
#side.collapsed #sideList::-webkit-scrollbar{width:0}
.pitem{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;cursor:pointer}
.pitem:hover{background:#ffffff14}
.pitem.active{background:#ffffff1f}
.pcover{width:44px;height:44px;border-radius:4px;flex:none;display:grid;place-items:center;font-weight:var(--font-weight-bold);font-size:16px;position:relative;cursor:pointer}
.pitem:hover .pcover{box-shadow:inset 0 0 0 999px #0007}
.pcoverPlay{position:absolute;inset:0;z-index:1;display:grid;place-items:center;color:var(--text);opacity:0;transition:opacity .15s}
.pitem:hover .pcoverPlay,.pcoverPlay:focus-visible{opacity:1}
#side.collapsed .pcoverPlay svg{width:20px;height:20px}
.pmeta{min-width:0}
.pmeta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:var(--text-2);font-size:14px}
#homeView{padding:24px 32px}
#homeView h2{margin:0 0 16px}
#feature{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:1fr auto;grid-template-areas:'cover info' 'cover play';column-gap:24px;row-gap:16px;align-items:end;margin:-24px -32px 32px;padding:48px 32px 32px;border-radius:8px 8px 0 0;cursor:pointer;transition:filter .15s}
#feature:hover{filter:brightness(1.08)}
#feature .fcover{width:var(--hero-cover);height:var(--hero-cover);border-radius:6px;flex:none;box-shadow:0 8px 24px #0006}
#feature .finfo{flex:1;min-width:0}
#feature .finfo small{font-size:12px;font-weight:var(--font-weight-bold);color:var(--text-2)}
#feature .finfo h2{font-size:var(--font-size-hero);line-height:1;margin:4px 0 8px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feature .finfo p{margin:0;color:var(--text);font-size:14px}
#feature .fcover{grid-area:cover;align-self:end}
#feature .finfo{grid-area:info}
#feature .fplay{grid-area:play;justify-self:start;align-self:start}
.fplay{height:56px;padding:0 24px 0 20px;border-radius:999px;background:var(--accent);color:#000;display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:var(--font-weight-bold);flex:none;box-shadow:0 8px 24px #0006;transition:transform .15s,background .15s}
.fplay:hover{background:var(--accent-hover);transform:scale(1.04)}

.card b,.pmeta b,#nowt b,.rtxt b{font-weight:var(--font-weight-semibold)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:#181818;border-radius:8px;padding:16px;cursor:pointer;transition:background .15s}
.card:hover{background:#282828}
.ccover{width:100%;aspect-ratio:1;border-radius:6px;position:relative}
.card b{display:block;font-size:16px;margin:12px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--text-2);font-size:14px;display:block}
/* The card's play disc waits for the pointer, so the hero above stays the one green call to action. */
.card-play{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .15s,transform .15s;box-shadow:0 6px 16px #0008}
.card:hover .card-play,.card-play:focus-visible{opacity:1;transform:none}
.card:hover .card-play:hover{transform:scale(1.04)}
@media(hover:none){.card-play{display:none}}
#plhead{padding:48px 32px 24px;display:flex;align-items:flex-end;gap:24px}
#plx{width:var(--hero-cover);height:var(--hero-cover);border-radius:6px;flex:none;display:grid;place-items:center;font-size:64px;font-weight:var(--font-weight-bold);color:var(--text);box-shadow:0 8px 24px #0006}
.plinfo small{display:block;font-size:12px;font-weight:var(--font-weight-bold)}
.plinfo h1{font-size:var(--font-size-hero);margin:4px 0 8px;line-height:1}
#dfsInfo b,#fsTxt b{font-size:24px;font-weight:var(--font-weight-bold);letter-spacing:-.02em}
.plinfo p{color:var(--text);font-size:14px;margin:0}
#plactions{display:flex;align-items:center;gap:24px;padding:24px 32px 16px}
#bigplay{height:56px;padding:0 24px 0 20px;border-radius:999px;background:var(--accent);color:#000;display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:var(--font-weight-bold);flex:none;transition:transform .15s,background .15s}
#bigplay:hover{transform:scale(1.04);background:var(--accent-hover)}
#plactions svg{width:24px;height:24px}
#plactions .aicon{width:40px;height:40px}
.aicon{color:var(--text-2);display:grid;place-items:center}
.aicon:hover{color:var(--text)}
.aicon.on{color:var(--text);position:relative}
.aicon.on::after{content:'';position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
#tbl{padding:0 32px 64px}
.tr-head,.row{display:grid;grid-template-columns:36px minmax(0,3fr) minmax(0,2fr) 60px;gap:12px;align-items:center;padding:4px 12px;border-radius:6px}
.tr-head{color:var(--text-2);font-size:12px;border-bottom:1px solid #ffffff29;margin:0 0 8px;height:36px}
.tr-head span{line-height:36px}
.row{height:56px;cursor:default}
.row:hover{background:#ffffff14}
.trnum{color:var(--text-2);font-variant-numeric:tabular-nums;font-size:16px}
.rt{min-width:0;display:flex;align-items:center;gap:12px}
.rtxt{min-width:0}
.rtxt b{display:block;font-size:16px;font-weight:var(--font-weight-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtxt small{color:var(--text-2);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ralb{color:var(--text-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdura{color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right}
/* A playlist whose tracks carry no album drops the column instead of showing an empty one. */
.no-album .tr-head,.no-album .row{grid-template-columns:36px 1fr 60px}
.no-album .tr-head span:nth-child(3),.no-album .ralb{display:none}
.row.playing .rtxt b,.srow.playing .rtxt b{color:var(--accent)}
.row.playing .trnum{color:var(--accent)}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:var(--accent);animation:b .9s ease infinite alternate}
.bars.paused i{animation-play-state:paused}
.bars i:nth-child(2){animation-delay:.3s}.bars i:nth-child(3){animation-delay:.15s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes b{from{height:4px}to{height:14px}}
.srow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;height:56px}
.srow:hover{background:#ffffff14}
.stag{background:#333;color:var(--accent);font-size:12px;padding:2px 6px;border-radius:4px;font-weight:var(--font-weight-bold);align-self:center}
.rbtn{color:var(--text-2)}
.rbtn:hover{color:var(--text)}

/* --- Bottom bar --- */
#bar{height:76px;flex:none;background:#000;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 8px;gap:12px;transition:height .2s}
#nowp{display:flex;align-items:center;gap:12px;min-width:0}
#nowc{width:52px;height:52px;border-radius:6px;background:#282828;flex:none}
#nowt{min-width:0}
#nowt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowt small{color:var(--text-2);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctr{display:flex;flex-direction:column;align-items:center;gap:8px}
#btns{display:flex;align-items:center;gap:16px}
#btns .aicon{width:32px;height:32px;flex:none}
#playb{width:40px;height:40px;flex:none;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s}
#playb:hover{box-shadow:0 0 0 1px #fff}
#btns button:disabled,#fsBtns button:disabled,#dfsBtn:disabled{opacity:.35;cursor:default;pointer-events:none}
#playb:disabled{opacity:.35;background:#fff;color:#000;box-shadow:none;cursor:default}
#prow{display:flex;align-items:center;gap:8px;width:100%;max-width:560px}
.ptime{color:var(--text-2);font-size:12px;min-width:34px;font-variant-numeric:tabular-nums}
#prog{flex:1;height:4px;background:#ffffff33;border-radius:999px;cursor:pointer;position:relative}
#progf{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:999px;width:0}
#prog:hover #progf{background:var(--accent)}
#rside{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--text-2)}
#rside .volume-row{width:auto;gap:0}
#rside .volume-row .aicon{width:32px;height:32px;padding:0}
#rside #vol{width:112px;height:16px;position:relative;cursor:pointer;background:linear-gradient(to bottom,transparent 6px,#ffffff33 6px,#ffffff33 10px,transparent 10px)}
#volf{position:absolute;left:0;top:6px;bottom:6px;background:#fff;border-radius:999px}
#vol.dragging #volf{background:var(--accent)}
#fs{display:none}
#dfsArt,#fsArt,#nowc{background-size:cover!important;background-position:center!important}
.track-cover{width:40px;height:40px;border-radius:4px;flex:none;background-size:cover!important;background-position:center!important}
.rside,.volume-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--text-2)}
.volume-row{width:90px}
#vol{width:100%;height:16px}
.stream-only{font-size:12px;color:var(--text-2)}
/* Compact Sonner/shadcn-inspired notifications, kept clear of player controls. */
.toast-viewport{position:fixed;top:max(72px,calc(env(safe-area-inset-top) + 64px));right:16px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:min(420px,calc(100vw - 32px));pointer-events:none}
.toast-card{position:relative;display:flex;align-items:center;gap:12px;width:auto;max-width:100%;min-height:58px;padding:12px 12px 12px 14px;border:1px solid #ffffff1a;border-radius:8px;background:#111113;color:var(--text);box-shadow:0 12px 32px #0009,0 2px 6px #0005;text-align:left;pointer-events:auto;animation:toast-in .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast-spinner{width:14px;height:14px;border:1.5px solid #ffffff36;border-top-color:#f4f4f5;border-radius:50%;animation:toast-spin .8s linear infinite}
@keyframes toast-spin{to{transform:rotate(360deg)}}
.toast-icon{width:22px;height:22px;flex:none;display:grid;place-items:center;border:1px solid #ffffff1a;border-radius:50%;background:#ffffff08;color:var(--text);font-size:14px;font-weight:var(--font-weight-bold)}
.toast-success .toast-icon{border-color:#22c55e40;background:#22c55e12;color:#4ade80}
.toast-error .toast-icon{border-color:#ef444440;background:#ef444412;color:#f87171}
.toast-message{flex:1;min-width:0;margin:0;color:var(--text);font-size:14px;font-weight:var(--font-weight-semibold);line-height:1.45;overflow-wrap:anywhere}
.toast-close{width:32px;height:32px;flex:none;display:grid;place-items:center;margin:-4px -4px -4px 0;border:0;border-radius:50%;background:transparent;color:var(--text-3);cursor:pointer;transition:background .15s,color .15s}
.toast-close:hover{background:#ffffff10;color:var(--text)}
.toast-body{display:flex;flex:1;flex-direction:column;gap:4px;min-width:0}
.toast-body b{font-size:14px;font-weight:var(--font-weight-semibold);line-height:1.3}
.toast-body>span{overflow:hidden;color:var(--text-2);font-size:12px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}
.toast-download{width:100%;gap:12px}
.toast-progress{height:3px;width:100%;margin-top:5px;overflow:hidden;border-radius:4px;background:#ffffff1a}
.toast-progress i{display:block;height:100%;border-radius:inherit;background:#a1a1aa;transition:width .2s}
.toast-percent{flex:none;color:var(--text-2);font-size:12px;font-variant-numeric:tabular-nums}
.toast-upnext .toast-icon{border-color:#ffffff20;color:var(--text);font-size:14px}
@media(max-width:820px){.toast-viewport{top:max(72px,calc(env(safe-area-inset-top) + 64px));right:12px;width:calc(100vw - 24px);align-items:stretch}.toast-card{min-height:54px;padding:10px 11px 10px 12px}}
@media(prefers-reduced-motion:reduce){.toast-card{animation:none}.toast-spinner{animation:none}}
#upd{margin-left:0;height:44px;padding:0 9px 0 14px;background:#141414;border:1px solid #ffffff14;color:var(--text);border-radius:8px;font-size:12px;display:none;align-items:center;gap:8px;flex:none;max-width:min(420px,45vw);min-width:0;box-shadow:0 5px 18px #0005}
#upd.on{display:flex}
#updtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Update controls use consistent icon sizing and an intentional install accent. */
#updcheck{background:transparent;color:var(--text-3);border:0;border-radius:8px;width:28px;height:28px;padding:0;display:none;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:color .15s,background .15s}
#updcheck:hover{color:var(--text);background:#ffffff12}
#updcheck:disabled{opacity:.45;cursor:default}
.lucide-spin{animation:updspin .9s linear infinite}
#updbtn{background:#292929;color:var(--text);border:0;border-radius:8px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:color .15s,background .15s,transform .15s}
#updbtn:hover{color:var(--text);background:#383838;transform:translateY(-1px)}
#updbtn.go{background:var(--accent);color:#000}
#updbtn.go:hover{background:var(--accent-hover);color:#000}
#updbtn:disabled{opacity:.6;cursor:default}
#updbtn.spin svg{animation:updspin .9s linear infinite}
@keyframes updspin{to{transform:rotate(360deg)}}
#upd.icononly{padding:0 5px;gap:0;border-color:transparent;background:transparent;box-shadow:none}
#upd.icononly #updbtn{width:38px;height:38px;border-radius:8px;background:#171717;color:var(--text-2)}
#upd.icononly #updbtn:hover{background:#292929;color:var(--text)}
#upd.icononly #updbtn.go{background:var(--accent);color:#000}
#upd.icononly #updbtn.go:hover{background:var(--accent-hover)}
#upd:not(.icononly):hover{background:#2a2a2a}
#empty{color:var(--text-2);padding:24px 8px;font-size:14px}

.empty-cta{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
#homeView .empty-cta h2{margin:0;font-size:24px}
.pill-cta{height:56px;display:inline-flex;align-items:center;gap:8px;padding:0 24px 0 20px;border-radius:999px;background:var(--accent);color:#000;font-size:16px;font-weight:var(--font-weight-bold);transition:background .15s,transform .15s}
.pill-cta:hover{background:var(--accent-hover);transform:scale(1.04)}
#bigplayBtns{display:flex}
/* ---------------- full screen mode (desktop / web, not mobile) ---------------- */
#dfsBtn{display:grid;place-items:center;width:32px;height:32px}
#dfs{display:none}
body.dfs #dfs{display:flex;position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;background:linear-gradient(180deg,#1c1c1c,#0a0a0a 60%)}
#dfs.open{display:flex;position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#1c1c1c,#0a0a0a 60%)}
#dfs.open #dfsQueue{width:340px;flex:none;border-left:1px solid #ffffff14;background:#111;display:flex;flex-direction:column;min-height:0;overflow:auto}
#dfs.open #dfsArt{width:min(52vh,40vw);aspect-ratio:1;border-radius:8px;background:#282828;box-shadow:0 30px 80px #000c;flex:none}
#dfs.open #dfsMain{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
body.dfs.dfsidle #dfsTop{opacity:0;pointer-events:none}
body.dfs.dfsidle #dfsInfo{opacity:1}
body.dfs #bar{position:fixed;left:0;right:0;bottom:0;z-index:95;transition:opacity .2s}

/* Keep cover borders evenly inset and clip artwork at the same rounded edge. */

/* playback bar: the Spotify-style add-to-playlist control and its picker */
#nowp{position:relative}

#nowsave{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:none;border:0;padding:0;transition:color .15s}
/* The disc is a layer of its own so hover can grow it without touching the
   glyph: scaling the button rendered the 16px icon at 16.8px and left the plus
   and the tick soft and off the pixel grid exactly while the pointer was on
   them. Growing the layer's inset instead keeps a crisp circle and leaves the
   glyph on its 26px, whole-pixel box. */
#nowsave:before{content:"";position:absolute;inset:0;border-radius:50%;background:#ffffff0f;border:1px solid #ffffff14;transition:inset .15s,background .15s,border-color .15s}
#nowsave>svg{position:relative;z-index:1}
#nowsave:hover{color:var(--text)}
#nowsave:hover:before{inset:-1px;background:#ffffff1c}
#nowsave.on{color:var(--accent)}
#nowsave.on:before{background:transparent;border-color:#ffffff33}
#nowsave.on:hover:before{background:#ffffff10;border-color:#ffffff59}
#nowsave:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save-menu{position:absolute;left:0;bottom:calc(100% + 14px);width:276px;background:#181818;border:1px solid #ffffff17;border-radius:8px;box-shadow:0 24px 60px #000e;z-index:110;overflow:hidden;animation:settings-rise .15s cubic-bezier(.2,.8,.2,1)}

.save-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px;border-radius:6px;color:var(--text);font-size:14px;text-align:left;transition:background .15s}
.save-row:hover{background:#ffffff10}
