plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// The server URL is baked in at build time. Leave it empty and the app asks
// for it once on first launch (saved in SharedPreferences), which keeps the
// APK usable when the tunnel hostname changes.
def serverUrl = (findProperty("kotassiumUrl") ?: System.getenv("KOTASSIUM_URL") ?: "").toString()
def appVersion = (findProperty("appVersion") ?: "2.1.0").toString()

// The page and the server are the ones at the repo root: the build copies them
// in, it does not keep a second copy. Same source of truth as the desktop app.
def repoRoot = file("${rootDir}/..")
def genPython = layout.buildDirectory.dir("generated/python").get().asFile
def genAssets = layout.buildDirectory.dir("generated/assets").get().asFile

android {
    namespace "app.kotassium.mobile"
    compileSdk 34

    defaultConfig {
        applicationId "app.kotassium.mobile"
        minSdk 24
        targetSdk 34
        versionCode appVersion.tokenize(".").collect { it.padLeft(3, "0") }.join("").toInteger()
        versionName appVersion
        buildConfigField "String", "KOTASSIUM_URL", "\"${serverUrl}\""

        // Ship the phone ABI only; do not include x86_64 emulator binaries.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            // Python sources are configured on the chaquopy block below: the
            // old android.sourceSets.python DSL no longer exists in v17.
            assets.srcDirs = ["src/main/assets", genAssets.absolutePath]
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def store = System.getenv("ANDROID_KEYSTORE")
            if (store) {
                storeFile file(store)
                storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "kotassium"
                keyPassword System.getenv("ANDROID_KEY_PASS") ?: System.getenv("ANDROID_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // Chaquopy's runtime Python must match the build machine's Python
        // major.minor (CI installs 3.12).
        version = "3.12"
        buildPython "python3"
        pip {
            install "yt-dlp"
            install "certifi"
        }
    }
    sourceSets {
        main {
            // Staged from the repo root by stageServer; src/main/python holds
            // only the boot glue.
            srcDir genPython.absolutePath
        }
    }
}

// Stage the repo's server and page into the build. Keep this list in sync with
// the modules serve_web.py imports at startup.
def stageServer = tasks.register("stageServer", Sync) {
    from(repoRoot) {
        include "serve_web.py", "spotify_get.py", "updater.py"
    }
    into genPython
}

def buildReactWeb = tasks.register("buildReactWeb", Exec) {
    workingDir repoRoot
    commandLine "npm", "run", "build"
}

def stageWeb = tasks.register("stageWeb", Sync) {
    dependsOn buildReactWeb
    from(new File(repoRoot, "web")) {
        include "**/*"
        exclude "app.jsx"
        into "web"
    }
    into genAssets
}

// preBuild is registered by AGP after the build script runs, so match it
// lazily instead of naming it now.
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn stageServer, stageWeb
}

// Chaquopy's own tasks read the python source dirs (merge<Variant>PythonSources
// is the one that actually consumes them), and AGP's asset merge reads the
// staged page. Both must run after the staging copy.
tasks.configureEach { t ->
    if (t.name.contains("Python")) {
        t.dependsOn stageServer
    }
    if (t.name.startsWith("merge") && t.name.endsWith("Assets")) {
        t.dependsOn stageWeb
    }
}

dependencies {
    // Chaquopy is the only dependency: it supplies CPython and the packages
    // above. There is no UI framework here on purpose.
}
