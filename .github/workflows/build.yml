name: build artifacts

# The build half of a release, shared by the two ways a release is made:
#   - release.yml      a v* tag you push yourself (a cut you name)
#   - auto-release.yml every push to main (a rolling patch bump)
#
# Both hand it a version and get the same Apple Silicon PKG and Android APK
# back, so a build cannot drift between the two paths.

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the app bundle
        required: true
        type: string
      platform:
        description: Which platform artifact to build
        required: true
        type: string
      macos:
        description: JSON matrix (runner + arch) of the macOS builds
        required: false
        type: string
        default: '[{"runner":"macos-14","arch":"arm64"}]'
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  macos:
    if: ${{ inputs.platform == 'macos' }}
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.macos) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos-build.txt

      - name: Restore yt-dlp binary
        id: yt-dlp-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/yt-dlp
          key: yt-dlp-macos-${{ runner.arch }}-latest

      - name: Version
        id: ver
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build the app bundle
        env:
          KOTASSIUM_VERSION: ${{ steps.ver.outputs.version }}
          KOTASSIUM_URL: ${{ vars.KOTASSIUM_URL }}
        run: |
          mkdir -p vendor
          if [ ! -x vendor/yt-dlp ]; then
            curl -fL --retry 3 -o vendor/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            chmod +x vendor/yt-dlp
          fi
          ./build-macos.sh

      - name: Cache yt-dlp binary
        uses: actions/cache/save@v4
        if: ${{ steps.yt-dlp-cache.outputs.cache-hit != 'true' }}
        with:
          path: vendor/yt-dlp
          key: yt-dlp-macos-${{ runner.arch }}-latest

      - name: Smoke test the bundle
        run: |
          APP=dist/Kotassium.app/Contents/MacOS/Kotassium
          codesign --verify --deep --strict dist/Kotassium.app
          "$APP" --selftest | tee selftest.txt
          grep -q "RESULT  ok" selftest.txt
          grep -q "Resources/bin/yt-dlp" selftest.txt
          KOTASSIUM_LIB="$RUNNER_TEMP/lib" "$APP" --no-window --port 8421 &
          PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8421/api/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8421/ | grep -qi "<title>Kotassium"
          kill "$PID"

      - name: Make the PKG
        env:
          KOTASSIUM_VERSION: ${{ steps.ver.outputs.version }}
        run: ./make-pkg.sh "Kotassium-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.pkg"

      - name: Verify the PKG
        run: |
          TMP=$(mktemp -d "$RUNNER_TEMP/kotassium-pkg.XXXXXX")
          trap 'rm -rf "$TMP"' EXIT
          pkgutil --payload-files Kotassium-*.pkg > "$TMP/payload-files.txt"
          grep -q 'Applications/Kotassium.app/Contents/MacOS/Kotassium' "$TMP/payload-files.txt"
          pkgutil --expand Kotassium-*.pkg "$TMP/expanded"
          PREINSTALL=$(find "$TMP/expanded" -type f -path '*/Scripts/preinstall' -print -quit)
          test -n "$PREINSTALL"
          test -x "$PREINSTALL"
          grep -q 'display dialog' "$PREINSTALL"
          test -x macos-pkg-scripts/preinstall

      # Keep the DMG alongside the PKG so releases remain consumable by the
      # DMG-only updater already installed in older Kotassium versions.
      - name: Make the legacy auto-update DMG
        env:
          KOTASSIUM_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          hdiutil detach /Volumes/Kotassium 2>/dev/null || true
          for attempt in 1 2 3; do
            if ./make-dmg.sh "Kotassium-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.dmg"; then
              exit 0
            fi
            echo "Legacy DMG creation failed (attempt $attempt); retrying in 20 seconds"
            hdiutil detach /Volumes/Kotassium 2>/dev/null || true
            sleep 20
          done
          echo "Could not create the DMG needed by existing auto-updaters" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Kotassium-${{ matrix.arch }}
          path: Kotassium-*.pkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Kotassium-${{ matrix.arch }}-legacy-dmg
          path: Kotassium-*.dmg
          if-no-files-found: error

  android:
    name: Android APK
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Version
        id: ver
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: android-pip-${{ runner.os }}-py312-yt-dlp-certifi-v1

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to ship an unsigned APK"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kotassium.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/kotassium.keystore" >> "$GITHUB_ENV"

      - name: Install web build dependencies
        run: npm ci

      - name: Build
        env:
          KOTASSIUM_URL: ${{ vars.KOTASSIUM_URL }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          gradle assembleRelease --build-cache --parallel --no-daemon \
            -PkotassiumUrl="$KOTASSIUM_URL" \
            -PappVersion="${{ steps.ver.outputs.version }}"

      - name: Verify and rename
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "Kotassium-${{ steps.ver.outputs.version }}.apk"
          ls -l Kotassium-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kotassium-apk
          path: Kotassium-*.apk
          if-no-files-found: error
