name: build artifacts

# The build half of a release, shared by the two ways a release is made:
#   - release.yml      a v* tag you push yourself (a cut you name)
#   - auto-release.yml every push to main (a rolling patch bump)
#
# Both hand it a version and get the same Apple Silicon PKG and Android APK
# back, so a build cannot drift between the two paths.

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the app bundle (blank = bump the newest tag)
        required: false
        type: string
        default: ""
      platform:
        description: Which platform artifact to build
        required: true
        type: string
      publish:
        description: Publish the PKG from the build job instead of uploading it
        required: false
        type: boolean
        default: false
      macos:
        description: JSON matrix (runner + arch) of the macOS builds
        required: false
        type: string
        # macos-14 was retired on 2026-11-02: jobs targeting it were cancelled
        # at queue time through the October brownouts and then stopped
        # resolving, which silently produced releases with only an APK.
        default: '[{"runner":"macos-15","arch":"arm64"}]'
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

# contents: write is what tools/publish-release.sh needs (only used when the
# caller asks for `publish:`); actions: read is what tools/await-preflight.sh
# reads this run's preflight job through.
permissions:
  contents: write
  actions: read

jobs:
  macos:
    if: ${{ inputs.platform == 'macos' }}
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.macos) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos-build.txt

      - name: Restore desktop-venv
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: desktop-venv
          key: desktop-venv-macos-${{ runner.arch }}-py312-${{ hashFiles('setup.sh', 'requirements-macos-build.txt') }}

      - name: Restore yt-dlp binary
        id: yt-dlp-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/yt-dlp
          key: yt-dlp-macos-${{ runner.arch }}-latest

      # Computed here rather than taken from the `version` job so the macOS
      # build starts straight away; a rolling release passes no version and
      # tools/next-version.sh answers the same patch bump that job would.
      - name: Version
        id: ver
        run: |
          VERSION=$(tools/next-version.sh "${{ inputs.version }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION"

      # py2app is the expensive half of this job and it only depends on the
      # interpreter and the requirements, not on our sources: reuse the bundle
      # it produced last time and let tools/update-macos-bundle.py replace the
      # files this commit owns. Bump the `v1` in this key when a dependency is
      # added - a stale bundle fails the smoke test below, so it cannot ship,
      # but bumping it is how you fix it instead of waiting for a red run.
      - name: Restore the built app bundle
        id: bundle
        uses: actions/cache/restore@v4
        with:
          path: dist/Kotassium.app
          key: app-macos-${{ runner.arch }}-py312-v1-${{ hashFiles('setup-macos.py', 'requirements-macos-build.txt', 'setup.sh') }}

      - name: Build the app bundle
        env:
          KOTASSIUM_VERSION: ${{ steps.ver.outputs.version }}
          KOTASSIUM_URL: ${{ vars.KOTASSIUM_URL }}
          KOTASSIUM_REUSE_BUNDLE: ${{ steps.bundle.outputs.cache-hit == 'true' && '1' || '' }}
        run: |
          mkdir -p vendor
          if [ ! -x vendor/yt-dlp ]; then
            curl -fL --retry 3 -o vendor/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            chmod +x vendor/yt-dlp
          fi
          ./build-macos.sh

      - name: Cache yt-dlp binary
        uses: actions/cache/save@v4
        if: ${{ steps.yt-dlp-cache.outputs.cache-hit != 'true' }}
        with:
          path: vendor/yt-dlp
          key: yt-dlp-macos-${{ runner.arch }}-latest

      - name: Cache desktop-venv
        uses: actions/cache/save@v4
        if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
        with:
          path: desktop-venv
          key: desktop-venv-macos-${{ runner.arch }}-py312-${{ hashFiles('setup.sh', 'requirements-macos-build.txt') }}

      - name: Smoke test the bundle
        env:
          KOTASSIUM_REUSE_BUNDLE: ${{ steps.bundle.outputs.cache-hit == 'true' && '1' || '' }}
        run: |
          APP=dist/Kotassium.app/Contents/MacOS/Kotassium
          codesign --verify --deep --strict dist/Kotassium.app
          "$APP" --selftest | tee selftest.txt
          grep -q "RESULT  ok" selftest.txt
          grep -q "Resources/bin/yt-dlp" selftest.txt
          if [ -n "$KOTASSIUM_REUSE_BUNDLE" ]; then
            # The reused bundle still holds the modules py2app compiled in. It
            # only counts as reused if this build's copies shadowed them, and
            # selftest reports which directory serve_web came from.
            grep -q "code    .*Resources/app" selftest.txt || {
              echo "::error::the reused bundle is running py2app's copies, not this build's"
              cat selftest.txt >&2
              exit 1
            }
          fi
          KOTASSIUM_LIB="$RUNNER_TEMP/lib" "$APP" --no-window --port 8421 &
          PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8421/api/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8421/ | grep -qi "<title>Kotassium"
          kill "$PID"

      # Saved only after the smoke test above passed, so a bundle that cannot
      # run is never the one the next release starts from.
      - name: Cache the app bundle
        uses: actions/cache/save@v4
        if: ${{ steps.bundle.outputs.cache-hit != 'true' }}
        with:
          path: dist/Kotassium.app
          key: app-macos-${{ runner.arch }}-py312-v1-${{ hashFiles('setup-macos.py', 'requirements-macos-build.txt', 'setup.sh') }}

      - name: Make the PKG
        env:
          KOTASSIUM_VERSION: ${{ steps.ver.outputs.version }}
        run: ./make-pkg.sh "Kotassium-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.pkg"

      - name: Verify the PKG
        run: |
          set -euo pipefail
          ls -l Kotassium-*.pkg
          BASE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          mkdir -p "$BASE"
          TMP=$(mktemp -d "$BASE/kotassium-pkg.XXXXXX")
          echo "TMP=$TMP"
          trap 'rm -rf "$TMP"' EXIT
          echo "--- payload files ---"
          pkgutil --payload-files Kotassium-*.pkg | tee "$TMP/payload-files.txt"
          grep -q 'Kotassium\.app/Contents/MacOS/Kotassium' "$TMP/payload-files.txt"
          echo "--- expanding package ---"
          pkgutil --expand-full Kotassium-*.pkg "$TMP/expanded"
          echo "--- package info ---"
          PKGINFO=$(find "$TMP/expanded" -maxdepth 2 -name PackageInfo -print -quit)
          if [ -z "$PKGINFO" ]; then
            echo "No PackageInfo found in fully expanded package; contents were:" >&2
            find "$TMP/expanded" -maxdepth 2 -print >&2
            exit 1
          fi
          echo "PKGINFO=$PKGINFO"
          grep -q 'install-location="/Applications"' "$PKGINFO"
          PREINSTALL=$(find "$TMP/expanded" -type f -name preinstall -print -quit)
          if [ -z "$PREINSTALL" ]; then
            echo "No preinstall script found in fully expanded package; contents were:" >&2
            find "$TMP/expanded" -print >&2
            exit 1
          fi
          echo "PREINSTALL=$PREINSTALL"
          grep -q 'display dialog' "$PREINSTALL"
          test -x macos-pkg-scripts/preinstall

      # A rolling release publishes the PKG here, one step after it is verified,
      # instead of handing it to a third runner through an artifact. Preflight
      # runs in parallel, so this waits for its verdict first: nothing is
      # published that the preflight job has not passed.
      - name: Publish the PKG
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          tools/await-preflight.sh
          tools/publish-release.sh "${{ steps.ver.outputs.version }}" \
            "Kotassium-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.pkg"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: Kotassium-${{ matrix.arch }}
          path: Kotassium-*.pkg
          if-no-files-found: error

  android:
    name: Android APK
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Version
        id: ver
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: android-pip-${{ runner.os }}-py312-yt-dlp-certifi-v1

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to ship an unsigned APK"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kotassium.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/kotassium.keystore" >> "$GITHUB_ENV"

      - name: Install web build dependencies
        run: npm ci

      - name: Build
        env:
          KOTASSIUM_URL: ${{ vars.KOTASSIUM_URL }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          gradle assembleRelease --build-cache --parallel --no-daemon \
            -PkotassiumUrl="$KOTASSIUM_URL" \
            -PappVersion="${{ steps.ver.outputs.version }}"

      - name: Verify and rename
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "Kotassium-${{ steps.ver.outputs.version }}.apk"
          ls -l Kotassium-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kotassium-apk
          path: Kotassium-*.apk
          if-no-files-found: error
