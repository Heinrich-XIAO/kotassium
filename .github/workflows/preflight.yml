name: Agent preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: Agent preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # React parity tests inspect the pre-migration source revision.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Run agent preflight
        run: tools/agent-preflight.sh
