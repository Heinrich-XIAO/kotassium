name: Release

# A named release cut: preflight and platform builds start together; a failed
# preflight cancels the run. Publish each artifact as soon as its build passes.
# A manual run is packaging-only and leaves release publication to a tag push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the app bundles
        required: false
        default: "2.1.0"
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: preflight
    needs: version
    uses: ./.github/workflows/preflight.yml

  cancel-builds-on-preflight-failure:
    name: cancel builds when preflight fails
    needs: preflight
    if: ${{ needs.preflight.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  macos:
    name: build Apple Silicon PKG
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: macos
      macos: '[{"runner":"macos-14","arch":"arm64"}]'
    secrets: inherit

  android:
    name: build Android APK
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: android
    secrets: inherit

  publish-macos:
    name: publish or attach Apple Silicon PKG
    needs: [version, preflight, macos, publish-macos-legacy-dmg]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.macos.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: Kotassium-arm64
      filename: Kotassium-${{ needs.version.outputs.version }}-arm64.pkg
    secrets: inherit

  publish-macos-legacy-dmg:
    name: preserve DMG compatibility for existing updaters
    needs: [version, preflight, macos]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.macos.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: Kotassium-arm64-legacy-dmg
      filename: Kotassium-${{ needs.version.outputs.version }}-arm64.dmg
    secrets: inherit

  publish-android:
    name: publish or attach Android APK
    needs: [version, preflight, android]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.android.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: Kotassium-apk
      filename: Kotassium-${{ needs.version.outputs.version }}.apk
    secrets: inherit
