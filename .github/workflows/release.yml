name: Release

# A release you name yourself: push a v* tag and the macOS DMGs and the
# Android APK for that commit are published under that tag. Use this for a
# cut you want to call something; use auto-release.yml for the everyday
# "every push ships" path. Both build through build.yml, so the two cannot
# drift apart.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the app bundles
        required: false
        default: "2.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    name: publish release
    needs: [version, build]
    # !cancelled() so the best-effort Intel job cannot block a tag: the step
    # below is what decides whether there is enough to publish. Only a tag
    # publishes - a manual run just uploads workflow artifacts, which is the
    # safe way to test packaging changes.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Require the Apple Silicon DMG and the APK
        run: |
          ls -l artifacts
          test -f artifacts/Kotassium-*-arm64.dmg
          test -f artifacts/Kotassium-*.apk

      - name: Checksums
        # The desktop app verifies its DMG against this file before installing.
        run: cd artifacts && sha256sum *.dmg *.apk | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            artifacts/*.dmg
            artifacts/*.apk
            artifacts/SHA256SUMS
          generate_release_notes: true
          body_path: .github/release-body.md
