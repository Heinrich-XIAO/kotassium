name: Auto release

# Every push to main ships a release: the version is the patch bump of the
# newest published tag, the DMGs and the APK are built from that exact
# commit, and the release is published under a new vX.Y.Z tag.
#
# That keeps the desktop app's self-updater working: it compares the tag
# against the version baked into the running bundle, so the numbers have to
# keep climbing - a rolling "latest" tag would never look newer.
#
# Releases contain the Apple Silicon DMG and Android APK only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (blank = bump the patch of the newest tag)
        required: false
        default: ""

# One release at a time, and never cancel one that is already building:
# the version below is read from the tags, so a cancelled run would leave
# the next one bumping the same number twice.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # Just enough tree for next_version.py; the tags come from ls-remote.
      - uses: actions/checkout@v4

      - name: Next version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Tags straight from the remote: the bump only needs the tag
            # names, and a full-history clone (the old fetch-depth: 0) costs
            # seconds before any build can start.
            TAGS=$(git ls-remote --tags --refs origin 'v*' | awk -F/ '{print $NF}')
            test -n "$TAGS" || { echo "no tags found on origin" >&2; exit 1; }
            VERSION=$(python3 .github/next_version.py $TAGS)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      # Build only the Apple Silicon DMG for the release.
      macos: '[{"runner":"macos-14","arch":"arm64"}]'
    secrets: inherit

  release:
    name: publish release
    needs: [version, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Require the Apple Silicon DMG and the APK
        run: |
          ls -l artifacts
          test -f artifacts/Kotassium-*-arm64.dmg
          test -f artifacts/Kotassium-*.apk

      - name: Checksums
        # The desktop app verifies its DMG against this file before installing.
        run: cd artifacts && sha256sum *.dmg *.apk | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          # The tag is created at this commit, so the release and the build
          # are the same tree.
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            artifacts/*.dmg
            artifacts/*.apk
            artifacts/SHA256SUMS
          generate_release_notes: true
          body_path: .github/release-body.md
