name: Auto release

# Every push to main creates a patch release. The Apple Silicon PKG is the one
# people wait for, so it starts immediately and publishes itself; the APK is
# built after it finishes rather than beside it, since it is a slower job whose
# result nobody is watching for. Preflight runs alongside both, and a failure
# there cancels the workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (blank = bump the patch of the newest tag)
        required: false
        default: ""

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Next version
        id: ver
        run: |
          VERSION=$(tools/next-version.sh "${{ inputs.version }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

  preflight:
    name: preflight
    needs: version
    uses: ./.github/workflows/preflight.yml

  cancel-builds-on-preflight-failure:
    name: cancel builds when preflight fails
    needs: preflight
    if: ${{ needs.preflight.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # The macOS build no longer waits for the `version` job: it resolves the same
  # patch bump itself (tools/next-version.sh) and publishes the PKG as soon as
  # it is verified, waiting only on preflight's verdict. That is ~20s off the
  # time between a push and a downloadable PKG.
  macos:
    name: build Apple Silicon PKG
    uses: ./.github/workflows/build.yml
    with:
      platform: macos
      publish: true
      macos: '[{"runner":"macos-15","arch":"arm64"}]'
    secrets: inherit

  # Sequenced behind the PKG on purpose: the macOS build and its publish are the
  # only thing on the critical path of a push, and a Linux runner assembling an
  # APK beside it buys nothing. `!cancelled()` rather than a success check, so a
  # broken macOS build still produces the APK and only the PKG is missing.
  android:
    name: build Android APK
    needs: [version, macos]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: android
    secrets: inherit

  publish-android:
    name: publish or attach Android APK
    needs: [version, preflight, android]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.android.result == 'success' }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: Kotassium-apk
      filename: Kotassium-${{ needs.version.outputs.version }}.apk
    secrets: inherit
