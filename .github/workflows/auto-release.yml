name: Auto release

# Every push to main creates a patch release. Apple Silicon and Android build
# in parallel with preflight; a failed preflight cancels the workflow, and
# successful builds publish/attach artifacts as soon as they complete.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (blank = bump the patch of the newest tag)
        required: false
        default: ""

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Next version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAGS=$(git ls-remote --tags --refs origin 'v*' | awk -F/ '{print $NF}')
            test -n "$TAGS" || { echo "no tags found on origin" >&2; exit 1; }
            VERSION=$(python3 .github/next_version.py $TAGS)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

  preflight:
    name: preflight
    needs: version
    uses: ./.github/workflows/preflight.yml

  cancel-builds-on-preflight-failure:
    name: cancel builds when preflight fails
    needs: preflight
    if: ${{ needs.preflight.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  macos:
    name: build Apple Silicon PKG
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: macos
      macos: '[{"runner":"macos-14","arch":"arm64"}]'
    secrets: inherit

  android:
    name: build Android APK
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: android
    secrets: inherit

  publish-macos:
    name: publish or attach Apple Silicon PKG
    needs: [version, preflight, macos]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.macos.result == 'success' }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: Kotassium-arm64
      filename: Kotassium-${{ needs.version.outputs.version }}-arm64.pkg
    secrets: inherit

  publish-android:
    name: publish or attach Android APK
    needs: [version, preflight, android]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.android.result == 'success' }}
    uses: ./.github/workflows/publish-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: Kotassium-apk
      filename: Kotassium-${{ needs.version.outputs.version }}.apk
    secrets: inherit
